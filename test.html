/* ---------- DOM helper ---------- */
function el(tag, attrs){
  const n=document.createElement(tag);
  attrs=attrs||{};
  for (const k in attrs){
    const v=attrs[k]; if (v==null) continue;
    if (k==="class") n.className=v;
    else if (k==="style") n.setAttribute("style",v);
    else if (k.startsWith("on") && typeof v==="function") n.addEventListener(k.slice(2),v);
    else n.setAttribute(k,v);
  }
  for (let i=2;i<arguments.length;i++){
    const kids=Array.isArray(arguments[i])?arguments[i]:[arguments[i]];
    for (const kid of kids){ if (kid==null) continue; n.appendChild(kid instanceof Node?kid:document.createTextNode(String(kid))); }
  }
  return n;
}
function toast(text, kind){
  const t = document.createElement("div");
  t.className = "toast" + (kind==="err"?" toast--err":" toast--ok");
  t.textContent = text;
  document.body.appendChild(t);
  requestAnimationFrame(()=>t.classList.add("is-show"));
  setTimeout(()=>{ t.classList.remove("is-show"); setTimeout(()=>t.remove(), 300); }, Math.min(6000, 1800 + String(text||"").length * 35));
}

function fmtDur(s){ if (!s) return "—"; const m=Math.floor(s/60), ss=s%60; return (m<10?"0":"")+m+":"+(ss<10?"0":"")+ss; }
function fmtDate(iso){ const d=new Date(iso); return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"2-digit",year:"numeric"}); }
function fmtDateShort(d){ return d.toLocaleDateString("uk-UA",{day:"2-digit",month:"short"}); }
function fmtTime(iso){ const d=new Date(iso); return d.toLocaleTimeString("uk-UA",{hour:"2-digit",minute:"2-digit"}); }
function fmtTimeRange(startedAtIso, durationSec, status){
  if (status==="live") return "в ефірі";
  if (!durationSec) return "—";
  const m = Math.floor(durationSec/60), sec = durationSec%60;
  if (m >= 60){ const h = Math.floor(m/60), mm = m%60; return h+" год "+mm+" хв"; }
  if (m >= 1) return m+" хв";
  return sec+" с";
}
function initials(name){ if (!name) return "?"; const p=name.trim().split(/\s+/); return (p[0][0]+(p[1]?p[1][0]:"")).toUpperCase(); }
function scoreRing(v, size){
  size = size || 44;
  const val = Math.max(0, Math.min(100, Number(v)||0));
  const color = val>=80?"var(--success)":val>=60?"var(--warn)":val>0?"var(--danger)":"var(--border-strong)";
  const d = el("div",{class:"score-ring", style:"width:"+size+"px;height:"+size+"px;--val:"+val+";--stroke:"+color+";"},
    el("span",{class:"score-ring__text"}, val+"%"));
  return d;
}

function sparkline(data, color){
  const w=120, h=36;
  if (!data||data.length<2) return el("div",{style:"height:"+h+"px;"});
  const max=Math.max.apply(null,data), min=Math.min.apply(null,data), span=Math.max(1,max-min), step=w/(data.length-1);
  const pts = data.map(function(v,i){ return (i*step).toFixed(1)+","+(h-((v-min)/span)*(h-6)-3).toFixed(1); }).join(" ");
  const svgNS="http://www.w3.org/2000/svg";
  const svg=document.createElementNS(svgNS,"svg");
  svg.setAttribute("viewBox","0 0 "+w+" "+h); svg.setAttribute("width","100%"); svg.setAttribute("height",h);
  const line=document.createElementNS(svgNS,"polyline");
  line.setAttribute("points",pts); line.setAttribute("fill","none"); line.setAttribute("stroke", color||"var(--brand)");
  line.setAttribute("stroke-width","2"); line.setAttribute("stroke-linecap","round"); line.setAttribute("stroke-linejoin","round");
  svg.appendChild(line); return svg;
}

function sameDay(a,b){ return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

function userAva(u, size){
  const cls = "ava"+(size==="xs"?" ava--xs":size==="sm"?" ava--sm":size==="lg"?" ava--lg":"");
  if (u && u.photoURL) return el("div",{class:cls}, el("img",{src:u.photoURL,alt:""}));
  return el("div",{class:cls}, initials((u&&(u.name||u.email))||"?"));
}

/* ---------- Floating util: close on outside click ---------- */
function closeOnOutside(popNode, triggerNode, onClose){
  const h=(ev)=>{
    // календар уже закрито іншим шляхом («Готово» тощо) — знімаємо себе й нічого не чіпаємо, інакше закриємо наступний, новий календар
    if (!popNode.isConnected){ document.removeEventListener("mousedown", h, true); return; }
    if (!popNode.contains(ev.target) && ev.target!==triggerNode && !triggerNode.contains(ev.target)){ onClose(); document.removeEventListener("mousedown", h, true); } };
  setTimeout(()=>document.addEventListener("mousedown", h, true), 0);
}

/* ---------- Custom styled dropdown ---------- */
function dropdown({ value, options, onChange, placeholder="Виберіть", renderItem, renderButton }){
  const wrap = el("div",{class:"dd"});
  const btnLabelWrap = el("span",{class:"dd__btn-left"});
  const btn  = el("button",{class:"dd__btn"}, btnLabelWrap, ICONS.chevronDown());
  let curVal = value;
  let pop = null, outside = null;
  function paintBtn(){
    btnLabelWrap.replaceChildren();
    const cur = options.find(o=>o.value===curVal);
    if (!cur){ btnLabelWrap.append(el("span",{class:"dd__btn-label muted"}, placeholder)); return; }
    if (renderButton) btnLabelWrap.append(renderButton(cur));
    else btnLabelWrap.append(el("span",{class:"dd__btn-label"}, cur.label));
  }
  paintBtn();
  function close(){
    if (!pop) return;
    pop.remove(); pop=null; btn.classList.remove("is-open");
    if (outside){ document.removeEventListener("mousedown", outside, true); outside=null; }
  }
  function open(){
    if (pop) return;
    pop = el("div",{class:"dd__pop"},
      options.map(o => el("div",{class:"dd__item"+(o.value===curVal?" is-active":""),
        onclick: ()=>{ curVal=o.value; paintBtn(); close(); onChange(o.value); }
      }, renderItem?renderItem(o):el("span",{},o.label)))
    );
    wrap.appendChild(pop);
    btn.classList.add("is-open");
    try {   // не вміщується знизу (у вікні/внизу екрана) — відкриваємо вгору; висоту обмежуємо доступним місцем
      const r = pop.getBoundingClientRect(), b = btn.getBoundingClientRect(), vh = window.innerHeight;
      const clip = btn.closest(".cv-modal__body, .modal");
      const lim = clip ? Math.min(vh, clip.getBoundingClientRect().bottom) : vh;
      if (r.bottom > lim - 8){
        const below = lim - b.bottom - 14, above = b.top - 14;
        if (above > below){ pop.style.top="auto"; pop.style.bottom="calc(100% + 6px)"; pop.style.maxHeight = Math.max(140, Math.min(320, above))+"px"; }
        else pop.style.maxHeight = Math.max(140, below)+"px";
      }
    } catch(_){}
    outside = (ev)=>{ if (pop && !pop.contains(ev.target) && !btn.contains(ev.target)) close(); };
    setTimeout(()=>document.addEventListener("mousedown", outside, true), 0);
  }
  btn.addEventListener("click",(e)=>{ e.stopPropagation(); if (pop) close(); else open(); });
  wrap.appendChild(btn);
  return wrap;
}

/* ---------- Date range picker (Monobank-style) ---------- */
const UK_MONTHS = ["січень","лютий","березень","квітень","травень","червень","липень","серпень","вересень","жовтень","листопад","грудень"];
const UK_DOW    = ["Пн","Вт","Ср","Чт","Пт","Сб","Нд"];

function dateRangeBtn({ start, end, onChange, defaultRange }){
  let _s = start, _e = end;
  const _oc = onChange;
  onChange = (r) => { _s = r.start; _e = r.end; _oc(r); };
  const btn = el("button",{class:"dd__btn", style:"min-width:220px;"},
    el("span",{class:"dd__btn-left"}, ICONS.calendar(), el("span",{class:"dd__btn-label"})),
    ICONS.chevronDown());
  function paint(){
    const lbl = btn.querySelector(".dd__btn-label");
    if (!_s && !_e) lbl.textContent = "Будь-яка дата";
    else if (_s && _e && sameDay(_s,_e)) lbl.textContent = fmtDateShort(_s);
    else if (_s && _e) lbl.textContent = fmtDateShort(_s)+" — "+fmtDateShort(_e);
    else if (_s) lbl.textContent = "З "+fmtDateShort(_s);
    else lbl.textContent = "По "+fmtDateShort(_e);
  }
  paint();
  let pop=null;
  btn.addEventListener("click",(e)=>{
    e.stopPropagation();
    if (pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); return; }
    let viewDate = new Date(_s || new Date()); viewDate.setDate(1);
    let s=_s?new Date(_s):null, en=_e?new Date(_e):null;
    pop = buildCalendar();
    btn.parentNode.appendChild(pop); // same parent as btn (wrapper)
    btn.classList.add("is-open");
    closeOnOutside(pop, btn, ()=>{ if (pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); } });

    function mclose(){ try { if (window.matchMedia("(max-width:700px)").matches && pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); } } catch(_){} }
    function buildCalendar(){
      const node = el("div",{class:"cal", style:"position:absolute;top:calc(100% + 6px);left:0;z-index:50;"});
      renderCal(node);
      return node;
    }
    function renderCal(node){
      const y = viewDate.getFullYear(), m = viewDate.getMonth();
      const first = new Date(y,m,1);
      const startDow = (first.getDay()+6)%7; // Mon=0
      const daysInMonth = new Date(y,m+1,0).getDate();
      const prevMonthDays = new Date(y,m,0).getDate();
      const today = new Date();

      const grid = el("div",{class:"cal__grid"});
      // dow row
      for (const d of UK_DOW) grid.appendChild(el("div",{class:"cal__dow"},d));
      // leading muted
      for (let i=0;i<startDow;i++){
        grid.appendChild(el("div",{class:"cal__day is-muted"}, String(prevMonthDays-startDow+1+i)));
      }
      for (let d=1; d<=daysInMonth; d++){
        const cur = new Date(y,m,d);
        const classes = ["cal__day"];
        if (sameDay(cur, today)) classes.push("is-today");
        if (s && en){
          if (sameDay(cur,s)) classes.push("is-start");
          if (sameDay(cur,en)) classes.push("is-end");
          if (cur>s && cur<en) classes.push("is-in-range");
        } else if (s){
          if (sameDay(cur,s)) { classes.push("is-start"); classes.push("is-end"); }
        }
        const dayEl = el("div",{class:classes.join(" "), onclick:()=>{
          if (!s || (s && en)){
            s = new Date(y,m,d); en = null;
          } else if (s && !en){
            const picked = new Date(y,m,d);
            if (picked < s){ en = s; s = picked; } else { en = picked; }
          }
          renderCal(node);
          // onChange НЕ викликаємо — застосуємо лише на «Готово».
        }}, String(d));
        grid.appendChild(dayEl);
      }
      // trailing muted
      const total = startDow + daysInMonth;
      const tail = (7 - (total%7)) % 7;
      for (let i=1;i<=tail;i++) grid.appendChild(el("div",{class:"cal__day is-muted"}, String(i)));

      const head = el("div",{class:"cal__head"},
        el("div",{class:"cal__title"}, UK_MONTHS[m]+" "+y),
        el("div",{class:"cal__nav"},
          el("button",{onclick:()=>{ viewDate.setMonth(viewDate.getMonth()-1); renderCal(node); }}, ICONS.chevronLeft()),
          el("button",{onclick:()=>{ viewDate.setMonth(viewDate.getMonth()+1); renderCal(node); }}, ICONS.chevronRight())));

      const quick = el("div",{class:"cal__quick"},
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t); en=new Date(t); viewDate=new Date(t); viewDate.setDate(1); renderCal(node); onChange({start:s,end:en}); paint(); mclose(); }},"Сьогодні"),
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t); s.setDate(t.getDate()-6); en=new Date(t); viewDate=new Date(s); viewDate.setDate(1); renderCal(node); onChange({start:s,end:en}); paint(); mclose(); }},"7 днів"),
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t); s.setDate(t.getDate()-29); en=new Date(t); viewDate=new Date(s); viewDate.setDate(1); renderCal(node); onChange({start:s,end:en}); paint(); mclose(); }},"30 днів"),
        el("button",{onclick:()=>{ const t=new Date(); s=new Date(t.getFullYear(),t.getMonth(),1); en=new Date(t); viewDate=new Date(s); renderCal(node); onChange({start:s,end:en}); paint(); mclose(); }},"Цей місяць"),
        el("button",{onclick:()=>{ s=null; en=null; renderCal(node); onChange({start:null,end:null}); paint(); mclose(); }},"Весь час"));

      const footer = el("div",{class:"cal__footer"},
        el("button",{onclick:()=>{ const dr = defaultRange ? defaultRange() : {start:null,end:null}; s=dr.start; en=dr.end; renderCal(node); onChange({start:s,end:en}); paint(); mclose(); }},"Очистити"),
        el("button",{onclick:()=>{
          // Якщо вибрали лише одну дату — вважаємо її і початком, і кінцем.
          if (s && !en) en = new Date(s);
          onChange({ start:s, end:en });
          paint();
          if (pop){ pop.remove(); pop=null; btn.classList.remove("is-open"); }
        }},"Готово"));

      node.replaceChildren(head, quick, grid, footer);
    }
  });
  const wrap = el("div",{class:"dd", style:"position:relative;"}, btn);
  return wrap;
}

/* ---------- Firestore API ---------- */
async function getCurrentUser(){
  const u=auth.currentUser; if (!u) return null;
  const mail = String(u.email||"").toLowerCase();
  let snap=await db.collection("users").doc(mail).get();
  if (!snap.exists && mail !== u.email) snap=await db.collection("users").doc(u.email).get();   // старі документи з великими літерами
  const d=snap.exists?snap.data():{};
  // self-heal: записать auth uid в users/{email}, если его там ещё нет
  if (snap.exists && !d.uid){
    try { await snap.ref.update({ uid: u.uid }); d.uid = u.uid; }
    catch(_){}
  }
  if (d.status==="deleted"){ logLoginFail(mail, "user-deleted"); try { await auth.signOut(); } catch(_){} return null; }   // видалений менеджер не заходить
  return { uid:u.uid, email:d.email||u.email, name:d.name||u.email.split("@")[0],
           role:d.role||ROLES.MANAGER, status:d.status||"active", aiBlocked:!!d.aiBlocked,
           aiMonth:d.aiMonth||null, aiSpentUsd:d.aiSpentUsd||0, aiLimitUsd:(d.aiLimitUsd!=null?d.aiLimitUsd:null),
           promotedBy:d.promotedBy||null, photoURL:d.photoURL||null };
}
function mapUserDocs(docs){
  return docs.map(s=>{
    const d=s.data();
    const isDel = d.status==="deleted";
    return { uid:s.id, email:d.email||s.id, name:(d.name||s.id.split("@")[0]) + (isDel ? " (видалений)" : ""), deleted:isDel, deletedAtMs:(d.deletedAt&&d.deletedAt.toMillis)?d.deletedAt.toMillis():0,
             role:d.role||ROLES.MANAGER, status:d.status||"active", aiBlocked:!!d.aiBlocked,
             aiMonth:d.aiMonth||null, aiSpentUsd:d.aiSpentUsd||0, aiLimitUsd:(d.aiLimitUsd!=null?d.aiLimitUsd:null),
             promotedBy:d.promotedBy||null, photoURL:d.photoURL||null };
  });
}
async function listUsers(){
  const qs=await db.collection("users").get();
  return mapUserDocs(qs.docs);
}
// Паролі-підказки: правила дозволяють лише запит з фільтром ролі (адмін — менеджери, головний адмін — менеджери й адміни, розробник — усі)
// Тимчасовий пароль бачить лише той, хто створив користувача (старі записи без createdBy лишаються видимими)
function _myTempPwOk(x){ const me=(firebase.auth().currentUser||{}).uid; return !x.createdBy || x.createdBy===me; }
function secretsQuery(){
  const c = db.collection("userSecrets");
  const r = activeUser && activeUser.role;
  if (r===ROLES.DEVELOPER) return c;
  if (r===ROLES.MAIN_ADMIN) return c.where("role","in",["manager","admin"]);
  return c.where("role","==","manager");
}
// «Живий» список користувачів: одне читання при вході, далі Firestore надсилає лише змінені документи
const USERS_CHANGED_EVT = "alexa-users-changed";
window.__usersWatch = null;
function startUsersWatch(withSecrets){
  if (window.__usersWatch) return window.__usersWatch.ready;
  let res, first = true;
  const ready = new Promise(r => res = r);
  const w = { ready, unsub:[] };
  window.__usersWatch = w;
  w.unsub.push(db.collection("users").onSnapshot(snap => {
    window.__users = mapUserDocs(snap.docs);
    try { sessionStorage.setItem("alexa_users_v1", JSON.stringify({ t:Date.now(), u:window.__users })); } catch(_){}
    try {   // свої витрати ШІ / ліміт підтягуються наживо (воркер дописує після кожного запиту)
      const me = activeUser && window.__users.find(x => String(x.email).toLowerCase()===String(activeUser.email).toLowerCase());
      if (me){ activeUser.aiMonth=me.aiMonth; activeUser.aiSpentUsd=me.aiSpentUsd; activeUser.aiLimitUsd=me.aiLimitUsd; activeUser.aiBlocked=me.aiBlocked; }
    } catch(_){}
    if (first){ first = false; res(); } else window.dispatchEvent(new Event(USERS_CHANGED_EVT));
  }, ex => { console.warn("usersWatch:", ex); if (first){ first = false; res(); } }));
  if (withSecrets){
    let f2 = true;
    w.sready = new Promise(r2 => {
      w.unsub.push(secretsQuery().onSnapshot(snap => {
        const m = {}; snap.forEach(d => { const x = d.data(); if (x.tempPassword && _myTempPwOk(x)) m[d.id] = x.tempPassword; });
        window.__tmpPass = m;
        if (f2){ f2 = false; r2(); } else window.dispatchEvent(new Event(USERS_CHANGED_EVT));
      }, ex => { console.warn("secretsWatch:", ex); window.__tmpPass = {}; if (f2){ f2 = false; r2(); } }));
    });
  }
  return ready;
}
function stopUsersWatch(){ const w = window.__usersWatch; if (w){ w.unsub.forEach(u=>{ try{u();}catch(_){} }); } window.__usersWatch = null; window.__users = []; window.__tmpPass = null; }

  const state = Math.random().toString(36).slice(2) + Date.now().toString(36);
  try { sessionStorage.setItem("yt_oauth_state", state); sessionStorage.setItem("yt_oauth_email", email); } catch(e){}

async function createNewUser(email,password,role,actorUid,name){
  email = String(email||"").trim().toLowerCase();   // Firebase Auth зберігає email малими літерами; id документа має збігатись
  const sec = firebase.apps.find(a=>a.name==="sec") || firebase.initializeApp(FIREBASE_CONFIG,"sec");
  const secAuth = sec.auth();
  const cred = await secAuth.createUserWithEmailAndPassword(email,password);
  await db.collection("users").doc(email).set({
    email, uid: cred.user.uid, role, name: name || email.split("@")[0],
    status:"active", promotedBy:actorUid, tempPw:true,
    createdAt: firebase.firestore.FieldValue.serverTimestamp(),
  });
  try { await db.collection("userSecrets").doc(email).set({ tempPassword:password, role:role, createdAt:firebase.firestore.FieldValue.serverTimestamp(), createdBy:actorUid||null }); } catch(ex){ console.warn("tempPass:", ex); }
  await secAuth.signOut();
  return cred.user.uid;
}

/* ---------- MOCK DATA (замінити коли поїде сервер) ---------- */
const MOCK_MANAGERS = [];
// Live cache of users (populated from Firestore on login and after user changes)
window.__users = [];
// Список користувачів: у сесійному кеші до 10 хв (зміни ролей/імен видно після дій на сторінці «Користувачі» — вона просить force).
async function refreshUserCache(force){
  if (window.__usersWatch){ await window.__usersWatch.ready; return; }   // живий список — читати заново не треба
  const K = "alexa_users_v1";
  try {
    if (!force){
      const raw = sessionStorage.getItem(K);
      if (raw){ const o = JSON.parse(raw); if (o && Date.now()-o.t < 3600000 && Array.isArray(o.u) && o.u.length){ window.__users = o.u; return; } }
    }
  } catch(_){}
  try { window.__users = await listUsers(); try { sessionStorage.setItem(K, JSON.stringify({ t:Date.now(), u:window.__users })); } catch(_){} }
  catch(ex){ console.warn("userCache:", ex); window.__users = []; }
}

const MOCK_CALLS = [];  // deprecated, залишено як fallback
window.__calls = [];
window.__callsSub = null;
const CALLS_CHANGED_EVT = "alexa-calls-changed";
function startCallsSubscription(user){
  if (window.__callsSub) return;
  if (!user || !user.email) return;
  const isAdminPlus = ["developer","main_admin","admin"].includes(user.role);
  if (!isAdminPlus){ startMgrTeamSubscription(user); return; }
  try {
    const base = db.collection("calls");
    const query = base.orderBy("startedAt","desc");
    window.__callsSub = query.onSnapshot(snap => {
      window.__callsLoaded = true;
      const __all = snap.docs.map(d => { const o = Object.assign({ id: d.id }, d.data()); if (o.status==="canceled" && o.stage==="revert_to_done") o.status = "done"; return o; })
        .sort((a,b) => String(b.startedAt||"").localeCompare(String(a.startedAt||"")));
      // «Розмови адміна» (для адмінів) живуть окремо і не потрапляють у звичайні списки, статистику й лічильники
      window.__adminCalls = __all.filter(c => c.kind==="admin_meeting");
      window.__calls = __all.filter(c => c.kind!=="admin_meeting");
      window.dispatchEvent(new Event(CALLS_CHANGED_EVT));
    }, err => {
      console.warn("calls subscribe:", err);
      window.__callsLoaded = true;
      window.__calls = [];
      window.dispatchEvent(new Event(CALLS_CHANGED_EVT));
    });
  } catch (ex) { console.warn(ex); }
}
// Менеджер бачить розмови всіх менеджерів (лише читання). Окремий запит на кожного менеджера (where managerEmail == …):
// так правила Firestore можуть перевірити, що розмова належить саме менеджеру, і «Розмови адміна» лишаються закритими.
function startMgrTeamSubscription(user){
  const subs = new Map(), bucket = new Map(), got = new Set();
  let timer = null, ready = false;
  const mapDocs = snap => snap.docs.map(d => { const o = Object.assign({ id: d.id }, d.data()); if (o.status==="canceled" && o.stage==="revert_to_done") o.status = "done"; return o; });
  const publish = () => {
    timer = null;
    const all = [].concat.apply([], Array.from(bucket.values()))
      .sort((a,b) => String(b.startedAt||"").localeCompare(String(a.startedAt||"")));
    window.__callsLoaded = true;
    window.__adminCalls = [];
    window.__calls = all.filter(c => c.kind!=="admin_meeting");
    window.dispatchEvent(new Event(CALLS_CHANGED_EVT));
  };
  const schedule = () => { if (!ready) return; if (!timer) timer = setTimeout(publish, 60); };
  const gotOne = email => { got.add(email); if (!ready && got.size >= subs.size){ ready = true; publish(); } };
  const subscribe = email => {
    if (subs.has(email)) return;
    const own = String(email).toLowerCase()===String(user.email).toLowerCase();
    let unsub = null;
    try {
      unsub = db.collection("calls").where("managerEmail","==",email).onSnapshot(snap => {

// Локальне сховище браузера (IndexedDB): великі «незмінні» дані (розшифровка й аналіз завершених розмов) читаються з бази ОДИН раз
// і далі беруться з пристрою, поки розмова не змінилась (підпис = статус+updatedAt+оцінка). Нове чи змінене — читається заново.
const idbKV = (function(){
  let p = null;
  function open(){
    if (p) return p;
    p = new Promise((res,rej)=>{
      try {
        const r = indexedDB.open("alexa-cache", 1);
        r.onupgradeneeded = ()=>{ r.result.createObjectStore("kv"); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
      } catch(e){ rej(e); }
    });
    return p;
  }
  return {
    async get(k){ try { const d = await open(); return await new Promise(res=>{ const q = d.transaction("kv").objectStore("kv").get(k); q.onsuccess=()=>res(q.result); q.onerror=()=>res(undefined); }); } catch(_){ return undefined; } },
    async set(k,v){ try { const d = await open(); await new Promise(res=>{ const tx = d.transaction("kv","readwrite"); tx.objectStore("kv").put(v,k); tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); }); } catch(_){} },
    async prune(max){   // лишаємо не більше max найсвіжіших записів
      try {
        const d = await open();
        const rows = await new Promise(res=>{ const out=[]; const q = d.transaction("kv").objectStore("kv").openCursor(); q.onsuccess=()=>{ const c=q.result; if (c){ out.push({k:c.key, at:(c.value&&c.value.at)||0}); c.continue(); } else res(out); }; q.onerror=()=>res([]); });
        if (rows.length <= max) return;
        rows.sort((a,b)=>a.at-b.at);
        const del = rows.slice(0, rows.length-max);
        await new Promise(res=>{ const tx = d.transaction("kv","readwrite"); const s = tx.objectStore("kv"); del.forEach(r=>s.delete(r.k)); tx.oncomplete=()=>res(); tx.onerror=()=>res(); tx.onabort=()=>res(); });
      } catch(_){}
    },
  };
})();

// Читає через локальний кеш: fetcher() викликається лише якщо запису нема або підпис змінився.
async function cachedRead(key, sig, fetcher){
  if (sig){
    const hit = await idbKV.get(key);
    if (hit && hit.sig === sig && hit.data !== undefined) return hit.data;
  }
  const data = await fetcher();
  if (sig && data !== undefined && data !== null){ await idbKV.set(key, { sig, data, at: Date.now() }); idbKV.prune(80); }
  return data;
}

(function(){
  let md = null;

  document.addEventListener("touchstart", e => { md = e.target; }, {capture:true, passive:true});
  // поки відкрито вікно — сторінка під ним не гортається (колесо над вікном без прокрутки гортало сайт)
  document.addEventListener("wheel", e => {

    // шукаємо предка, який справді може гортатись у цьому напрямку; якщо такого немає — гасимо подію
    let n = e.target;

      if (n.scrollHeight > n.clientHeight + 1){
        const oy = getComputedStyle(n).overflowY;
        if (oy === "auto" || oy === "scroll"){
          if ((e.deltaY < 0 && n.scrollTop > 0) || (e.deltaY > 0 && n.scrollTop + n.clientHeight < n.scrollHeight - 1)) return;
        }

      if (n === bg) break;
      n = n.parentNode;

    e.preventDefault();

  document.addEventListener("touchmove", e => {
    const bg = e.target && e.target.closest && e.target.closest(".modal-bg, .cv-overlay");
    if (!bg) return;
    let n = e.target;
    while (n && n !== document.body){
      if (n.scrollHeight > n.clientHeight + 1){ const oy = getComputedStyle(n).overflowY; if (oy === "auto" || oy === "scroll") return; }
      if (n === bg) break;
      n = n.parentNode;

    if (!ok) return false;

  const FV = firebase.firestore.FieldValue;

    upd = { status:"ended", stage:"waiting_worker", audioReady:false, transcriptReady:false, manualStart:true, error:null, progress:0,
            hq:true, hqAt:FV.serverTimestamp(), transcribeOnly: mode==="hq_only" ? true : FV.delete(), wordCount:FV.delete(), emptyAt:FV.delete() };
  } else {
    upd = c.transcriptReady
      ? { status:"queued_for_analysis", stage:"waiting_ai", manualStart:false, error:null }
      : { status: c.audioReady ? "queued" : "ended", stage:"waiting_worker", manualStart:true, error:null };

  // тому воркер сам відкидає застарілий hq (hqAt ≠ restartedAt)
  if (mode==="analysis" && activeUser.role!==ROLES.MANAGER) Object.assign(upd, { hq:FV.delete(), hqAt:FV.delete(), transcribeOnly:FV.delete() });
  upd.restartedBy = activeUser.uid; upd.restartedAt = FV.serverTimestamp();

  await db.collection("calls").doc(c.id).update(upd);

// «якісна» у статусі лише для запуску, який справді поставив прапор (hqAt збігається з restartedAt): застарілий прапор менеджерського перезапуску не показуємо
function hqIsLive(c){
  if (!c || !c.hq) return false;
  try { return !c.hqAt || (c.restartedAt && c.hqAt.toMillis && c.restartedAt.toMillis && c.hqAt.toMillis()===c.restartedAt.toMillis()); } catch(_){ return false; }
}
// Автоповтор завантаження: коли YouTube тимчасово не віддає аудіо, сервер сам пробує ще раз (і лікує себе).
// Щоб це не виглядало як «зламалось / Не оброблено», показуємо спокійний жовтий статус «Повтор через N хв».
const YT_BLOCK_RX = /sign in to confirm|not a bot|confirm you|HTTP Error (403|429)|Requested format is not available/i;
const RETRY_TIP = "YouTube тимчасово не віддає відео. Сервер повторить сам, нічого натискати не треба.";
// Приватне відео на YouTube: повторювати марно, потрібно, щоб власник каналу відкрив «Доступ за посиланням».
const PRIVATE_TIP = "Відео приватне на YouTube, сервер не може його завантажити. Власник каналу має в YouTube Studio поставити «Доступ за посиланням», потім тут натиснути «Обробити заново».";
// Перевірка приватності з боку сайту (не залежить від воркера): oEmbed YouTube для приватного відео відповідає 401/403.
const PRIV_CHECK = {};   // videoId → {t: час перевірки, priv: true/false}
async function ytIsPrivate(vid, force){
  if (!vid) return null;
  const old = PRIV_CHECK[vid];
  if (!force && old && Date.now()-old.t < 300000) return old.priv;
  try {
    const r = await fetch("https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v="+encodeURIComponent(vid)+"&format=json");
    const priv = (r.status===401 || r.status===403) ? true : (r.ok ? false : null);
    if (priv === null) return old ? old.priv : null;
    const changed = !old || old.priv !== priv;
    PRIV_CHECK[vid] = { t: Date.now(), priv };
    if (changed && !force) window.dispatchEvent(new Event(CALLS_CHANGED_EVT));
    return priv;
  } catch(_){ return old ? old.priv : null; }
}
window.addEventListener(CALLS_CHANGED_EVT, () => {
  try {
    let n = 0;
    for (const c of (window.__calls || [])) {
      if (n >= 6) break;
      if (!c.videoId || c.audioReady) continue;
      if (!(c.stage === "dl_retry" || c.dlAttempts > 0 || ["error","canceled","idle"].includes(c.status))) continue;
      const o = PRIV_CHECK[c.videoId];
      if (o && Date.now()-o.t < 300000) continue;
      PRIV_CHECK[c.videoId] = { t: Date.now(), priv: o ? o.priv : false };   // щоб не слати повторні запити, поки йде перевірка
      n++; ytIsPrivate(c.videoId, false);
    }
  } catch(_){}
});
function isPrivateCall(c){
  if (!c || c.audioReady) return false;
  if (c.videoId && PRIV_CHECK[c.videoId] && PRIV_CHECK[c.videoId].priv === true && !["done","transcribed","transcribing","analyzing","queued_for_analysis","no_show"].includes(c.status)) return true;
  // позначку dlReason ставить сервер; вона лишається, навіть якщо звонок скасували або перезапустили (поки не скачається / не зміниться причина)
  if (c.dlReason === "private" && ["error","canceled","idle","skipped_short"].includes(c.status)) return true;
  return c.status === "error" && /this video is private|private video/i.test(String(c.error || ""));
}
function retryText(at){
  if (!at) return "Повтор скоро";
  const sec = at - Date.now()/1000;
  return sec > 50 ? "Повтор через " + Math.ceil(sec/60) + " хв" : "Повтор зараз";
}
function retryInfo(c){
  if (!c) return null;
  if (c.stage === "dl_retry" && (c.status === "ended" || c.status === "queued")){
    const at = Number(c.dlRetryAt) || 0;
    return { text: retryText(at), at: at };
  }
  if (c.status === "error" && YT_BLOCK_RX.test(String(c.error || ""))){   // усі спроби вичерпано, але сервер ще лікується й поверне в чергу
    let up = 0; try { up = c.updatedAt && c.updatedAt.toMillis ? c.updatedAt.toMillis() : 0; } catch(_){}
    if (up && Date.now() - up < 15*60000) return { text: "Повтор автоматично", at: 0 };
  }
  return null;
}
if (!window.__retryTick) window.__retryTick = setInterval(()=>{   // оновлюємо «через N хв» на місці, без перемальовування списку
  document.querySelectorAll("[data-retry-at]").forEach(n=>{ const t = retryText(Number(n.getAttribute("data-retry-at"))); if (n.textContent !== t) n.textContent = t; });
}, 15000);

function statusBadge(status, hqMark, call, detail){   // detail=true — лише в картці розмови (там показуємо «✓ Завантажено · черга»)
  if (status==="live") return el("span",{class:"badge badge--live"}, "В ЕФІРІ");
  if (call && isPrivateCall(call)) return el("span",{class:"badge badge--priv", title: PRIVATE_TIP}, "Приватне відео");
  if (call && call.stage==="video_removed" && status==="canceled") return el("span",{class:"badge badge--queue", title:"Ефір видалено або недоступний на YouTube, тому розмова не оброблялась."}, "Відео видалено");
  if (call && status==="idle" && call.transcriptReady)   // розшифровано, аналіз ще не запускали (розмова додана вручну)
    return el("span",{class:"badge badge--analysis", title:"Розшифровка готова. ШІ-аналіз ще не запущено: натисни «Зробити аналіз»."}, "Розшифровано · чекає аналізу");
  const ri = call ? retryInfo(call) : null;
  if (ri){ const b = el("span",{class:"badge badge--retry", title: RETRY_TIP}, ri.text); if (ri.at) b.setAttribute("data-retry-at", String(ri.at)); return b; }
  if (detail && call && (status === "queued" || status === "ended")){
    if (call.audioReady && !call.transcriptReady)
      return el("span",{class:"badge badge--queue", title:"Аудіо вже завантажено. Чекає своєї черги на транскрибацію (розшифровка йде по одній розмові)."}, "✓ Завантажено · черга");
    if (!call.audioReady)
      return el("span",{class:"badge badge--queue", title:"Аудіо ще не завантажено. Завантаження йде по одній розмові."}, "Черга · завантаження");
  }
  const map = { queued:"queue", ended:"queue", queued_for_analysis:"analysis", transcribed:"analysis", downloading:"trans", transcribing:"trans", analyzing:"analysis", done:"done", error:"queue", skipped_short:"queue", canceled:"queue", idle:"queue", no_show:"queue" };
  return el("span",{class:"badge badge--"+(map[status]||"queue")}, (STATUS_LBL[status]||status) + (hqMark && (status==="done"||status==="transcribing"||status==="downloading") ? " (якісна)" : ""));
}


const PROC_STATES = ["downloading","transcribing","analyzing"];
const STEP_LBL = { downloading:"Завантаження аудіо", transcribing:"Транскрибація", analyzing:"Аналіз" };
function progressPct(c){ return typeof c.progress==="number" ? Math.max(0,Math.min(100,Math.round(c.progress))) : 0; }
// Який крок обробки зараз: 0 завантаження, 1 транскрибація, 2 аналіз; -1 — не в обробці.
// Для розмови, що стоїть у черзі, це наступний крок, який вона чекає (щоб було видно, що раніші кроки вже ✓).
function callStepIdx(c){
  if (!c) return -1;
  if (PROC_STATES.includes(c.status)) return PROC_STATES.indexOf(c.status);
  if (c.status === "queued_for_analysis" || c.status === "transcribed") return 2;
  if (c.status === "queued" || c.status === "ended") return (c.audioReady && !c.transcriptReady) ? 1 : 0;
  return -1;
}
function cvProgressNode(c){
  const isProc = PROC_STATES.includes(c.status), i = callStepIdx(c), pct = isProc ? progressPct(c) : 0;
  const ri = retryInfo(c);
  const top = ri ? ri.text : (isProc ? (STEP_LBL[c.status]||"") : "В черзі");
  return el("div",{class:"cv-prog", "data-cv-pb":c.id},
    el("div",{class:"cv-prog__top"}, el("b",{}, top), el("span",{class:"cv-prog__pct"}, isProc ? pct+"%" : "")),
    el("div",{class:"pbar"}, el("span",{style:"width:"+pct+"%"})),
    el("div",{class:"cv-prog__steps", style:"margin-top:8px;"},
      PROC_STATES.map((st,k)=> el("span",{class: k<i?"is-done":(k===i?"is-on":"")},
        (k<i?"✓ ":(k===i?(isProc?"● ":"◌ "):"○ ")) + STEP_LBL[st] + ((k===i && !isProc) ? " (в черзі)" : "")))));
}
// Живі відсотки в списку «Розмови»: оновлюємо лише цифру й смужку на місці (без перемальовування списку й без додаткових читань —
// дані вже прийшли від єдиної підписки на calls).
function listProgressUpdate(){
  const nodes = document.querySelectorAll("[data-lp],[data-lpb]");
  if (!nodes.length) return;
  const byId = new Map(callsAll().map(c=>[c.id,c]));
  nodes.forEach(n=>{
    const id = n.dataset.lp || n.dataset.lpb, c = byId.get(id); if (!c) return;
    const p = progressPct(c);
    if (n.hasAttribute("data-lp")){ const s = p+"%"; if (n.textContent !== s) n.textContent = s; }
    else { const w = p+"%"; if (n.style.width !== w) n.style.width = w; }
  });
}
function cvProgressUpdate(c){
  if (!PROC_STATES.includes(c.status)) return;   // у черзі процент не показуємо
  const n = document.querySelector('[data-cv-pb="'+c.id+'"]'); if(!n) return;
  const pct = progressPct(c);
  n.querySelector(".cv-prog__pct").textContent = pct+"%"; n.querySelector(".pbar>span").style.width = pct+"%";
}

function periodStart(key){
  const d=new Date();
  if (key==="today")  { d.setHours(0,0,0,0); return d; }
  if (key==="week")   { d.setDate(d.getDate()-6); d.setHours(0,0,0,0); return d; }
  if (key==="month")  { d.setDate(d.getDate()-29); d.setHours(0,0,0,0); return d; }
  if (key==="year")   { d.setDate(d.getDate()-364); d.setHours(0,0,0,0); return d; }
  return new Date(0);
}
function overviewFiltered(periodKey){
  const from = periodStart(periodKey);
  return callsAll().filter(c => !c.isTest && new Date(c.startedAt) >= from);
}

/* ---------- Підсвітка «зверни увагу» (жовта/червона обводка) ---------- */
let _attnUnsubs = [];
function watchAttention(user, settingsItem, gearBtn){
  _attnUnsubs.forEach(u=>{ try{u();}catch(_){} }); _attnUnsubs = [];
  const isAdminPlus = ["admin","main_admin","developer"].includes(user.role);
  if (isAdminPlus && settingsItem){
    let limit = 10, u = {}, srv = "";
    const paint = ()=>{
      const spent = Math.max(Number(u.analysisCostUsd||0)+Number(u.chatCostUsd||0), Number(u.realCostUsd||0));
      const pct = limit>0 ? spent/limit*100 : 0;
      settingsItem.classList.toggle("has-danger", pct>=100 || srv==="error");
      settingsItem.classList.remove("has-warn");
      settingsItem.classList.toggle("has-dot", (pct>=90 && pct<100 && srv!=="error") || (srv==="warn" && pct<100));   // жовте — лише блимаючий кружечок; червоне (has-danger) — обводка
      settingsItem.title = pct>=100 ? "Ліміт ШІ вичерпано — ШІ зупинено" : srv==="error" ? "Проблема на сервері — відкрий Налаштування" : pct>=90 ? "Витрачено понад 90% ліміту ШІ" : srv==="warn" ? "Сервер виправляє несправність сам" : "";
    };
    let srvTs = null;
    _attnUnsubs.push(db.collection("health").doc("server").onSnapshot(sn=>{
      const x = sn.exists ? sn.data() : null; srv = x ? (x.status||"") : ""; srvTs = x && x.checkedAt && x.checkedAt.toDate ? x.checkedAt.toDate() : null;
      if (srvTs && Date.now()-srvTs.getTime() > 3*3600000) srv = "error"; paint();
    }, ()=>{}));
    { const tmA = setInterval(()=>{ if (srvTs && Date.now()-srvTs.getTime() > 3*3600000 && srv!=="error"){ srv = "error"; paint(); } }, 300000); _attnUnsubs.push(()=>clearInterval(tmA)); }
    const d = new Date(); const mk = d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0");
    _attnUnsubs.push(db.collection("settings").doc("ai").onSnapshot(sn=>{ const c = sn.exists ? sn.data() : {}; if (c.limitUsd) limit = Number(c.limitUsd); paint(); }, ()=>{}));
    _attnUnsubs.push(db.collection("usage").doc(mk).onSnapshot(sn=>{ u = sn.exists ? sn.data() : {}; paint(); }, ()=>{}));
  }
  if (gearBtn){
    // шестерня мигає, якщо: пароль досі тимчасовий (усі ролі) або YouTube не підключено (менеджер)
    let ytBad = false, ytMsg = "", pwTemp = false;
    const paintGear = ()=>{
      gearBtn.classList.toggle("has-warn", ytBad || pwTemp);
      const m = []; if (pwTemp) m.push("Зміни тимчасовий пароль"); if (ytBad) m.push(ytMsg);
      gearBtn.title = m.length ? m.join(" · ") : "Налаштування профілю";
    };
    window.__myTempPw = false;
    _attnUnsubs.push(db.collection("users").doc(String(user.email).toLowerCase()).onSnapshot(sn=>{
      pwTemp = !!(sn.exists && sn.data().tempPw === true); window.__myTempPw = pwTemp; paintGear();
    }, ()=>{}));
    if (user.role === "manager"){
      _attnUnsubs.push(db.collection("channels").doc(user.email).onSnapshot(sn=>{
        const ok = sn.exists && sn.data().status === "active";
        ytBad = !ok; ytMsg = sn.exists ? "Потрібно підключити YouTube знову" : "Підключи свій YouTube канал"; paintGear();
      }, ()=>{}));
    }
  }
}

function fmtDateTimeShort(iso){
  if (!iso) return "—";
  try {
    const d = new Date(iso);
    const dd = String(d.getDate()).padStart(2,"0");
    const mm = String(d.getMonth()+1).padStart(2,"0");
    const yy = d.getFullYear();
    const hh = String(d.getHours()).padStart(2,"0");
    const mi = String(d.getMinutes()).padStart(2,"0");
    return `${dd}.${mm}.${yy} ${hh}:${mi}`;

// Реальні аналізи готових розмов (analysis/main), з кешем
const __anCache = new Map();
// Постійний кеш (localStorage) для розмов без digest: зріз аналізу (слабкі місця + бали критеріїв) читаємо з бази один раз, далі — з браузера
const AN_LS_KEY = "alexa_an_cache_v2";
let __anLs = null, __anLsTimer = null;
function anLsAll(){ if (__anLs) return __anLs; try { __anLs = JSON.parse(localStorage.getItem(AN_LS_KEY)||"{}") || {}; } catch(_){ __anLs = {}; } return __anLs; }
function anLsSave(){
  clearTimeout(__anLsTimer);
  __anLsTimer = setTimeout(()=>{ try {
    const o = anLsAll(), keys = Object.keys(o);
    if (keys.length > 800) keys.sort((x,y)=>(o[x].t||0)-(o[y].t||0)).slice(0, keys.length-800).forEach(k=>delete o[k]);
    localStorage.setItem(AN_LS_KEY, JSON.stringify(o));
  } catch(_){ try { localStorage.removeItem(AN_LS_KEY); } catch(__){} __anLs = {}; } }, 800);
}
async function loadAnalyses(calls){
  const done = calls.filter(c=>c.status==="done");
  await Promise.all(done.map(async c=>{
    const sig = String(c.score)+"|"+String(c.updatedAt);
    const hit = __anCache.get(c.id); if (hit && hit.sig===sig) return;
    let a=null;
    if (c.digest && typeof c.digest === "object"){       // зріз аналізу вже в документі розмови — 0 додаткових читань
      __anCache.set(c.id,{sig,a:{ weaknesses:(c.digest.w||[]), criteria:(c.digest.c||[]) }});
      return;
    }
    const ls = anLsAll()[c.id];
    if (ls && ls.sig===sig){ __anCache.set(c.id,{sig,a:{ weaknesses:ls.w||[], criteria:ls.c||[] }}); return; }      // з браузера: 0 читань бази
    try { const sn = await db.collection("calls").doc(c.id).collection("analysis").doc("main").get(); if (sn.exists) a = sn.data(); } catch(_){}
    if (a){
      anLsAll()[c.id] = { sig, t:Date.now(),
        w:(a.weaknesses||[]).map(x=>({ criterion:(x&&x.criterion)||"", title:(x&&x.title)||"" })),
        c:(a.criteria||[]).map(x=>({ name:(x&&(x.name||x.title))||"", score:x&&x.score })) };
      anLsSave();
    }
    __anCache.set(c.id,{sig,a});
  }));
  return done.map(c=>({call:c, a:(__anCache.get(c.id)||{}).a})).filter(x=>x.a);
}

// У середню оцінку йдуть лише повні діагностики (sales). Дожим і кваліфікація (ЦА чи ні) — окремо, у середню не входять.

  const avg    = done.length ? Math.round(done.reduce((s,c)=>s+(c.score||0),0)/done.length) : 0;
  const periodLabel = (PERIODS.find(p=>p.key===period)||PERIODS[0]).label.toLowerCase();

  // Останні 3 розмови (готові або в процесі)
  const recent = calls.slice().sort((a,b)=> new Date(b.startedAt)-new Date(a.startedAt)).slice(0,5);

  const seg = el("div",{class:"period-seg"},
    PERIODS.map(p => el("button",
      { class: p.key===period?"is-active":"",
        onclick: ()=>{ setOverviewPeriod(p.key); renderOverview(root); } },
      p.label)));

  const leftBlock = el("div",{class:"card"});
  function paintLeft(list, loading){
    // Групуємо слабкі місця по розмові: 1 блок = 1 розмова (не 1 момент).
    const byCall = new Map();
    list.forEach(({call,a}) => {
      const ws = a.weaknesses || [];
      if (!ws.length) return;
      const g = byCall.get(call.id) || { call, weaknesses: [], critCount: 0 };
      ws.forEach(w => { g.weaknesses.push(w); if (w.severity === "critical") g.critCount++; });
      byCall.set(call.id, g);
    });
    const groups = Array.from(byCall.values());
    // Сортування: спочатку з критичними (більше критичних — вище), потім за свіжістю.
    groups.sort((x,y) => (y.critCount - x.critCount) || (new Date(y.call.startedAt) - new Date(x.call.startedAt)));
    const anyCrit = groups.some(g => g.critCount > 0);
    const shown = groups.slice(0, 3);
    const plr = (n,a,b,c) => (n%10===1 && n%100!==11) ? a : (n%10>=2 && n%10<=4 && (n%100<10||n%100>=20)) ? b : c;
    const blockTitle = anyCrit ? "Критичні помилки менеджерів" : "Моменти менеджерів";
    const mkRow = (g, onNav) => {
            const call = g.call;
            const mgr  = userByEmail(call.managerEmail);
            const total = g.weaknesses.length;
            const isCrit = g.critCount > 0;
            const titleTxt = call.client || call.title || "(без назви)";
            const subParts = [mgr.name || call.managerEmail];
            if (isCrit) subParts.push(g.critCount + " критичних · " + total + " всього");
            else        subParts.push(total + " " + plr(total,"слабке місце","слабкі місця","слабких місць"));
            const sortedW = g.weaknesses.slice().sort((a,b) => ((b.severity==="critical")|0) - ((a.severity==="critical")|0));
            const previewItems = sortedW.slice(0, 2).map(w => (w.title||"").trim()).filter(Boolean);
            const rest = total - previewItems.length;
            const previewTxt = previewItems.join(" · ") + (rest > 0 ? "  · +"+rest+" ще" : "");
            return el("div",{class:"sev-row"+(isCrit?" is-danger":""), onclick:()=>{ if (onNav) onNav(); callDetailState.tab = "weak"; location.hash = "#/calls/"+call.id; }},
              userAva(mgr),
              el("div",{style:"min-width:0;"},
                el("div",{class:"sev-row__title"}, titleTxt),
                el("div",{class:"sev-row__sub"}, subParts.join(" · ")),
                previewTxt ? el("div",{class:"sev-row__sub",style:"margin-top:6px;color:var(--text);opacity:.85;line-height:1.4;"}, previewTxt) : null),
              el("div",{style:"text-align:right;align-self:start;"},
                el("div",{class:"muted xs"}, call.startedAt?fmtTime(call.startedAt):""))
            );
    };
    const openAll = () => {
      const bg = el("div",{class:"modal-bg", onclick:(e)=>{ if (e.target===bg) bg.remove(); }},
        el("div",{class:"modal modal-wide ov-all",style:"max-width:720px;"},
          el("div",{class:"ov-all__head"},
            el("div",{style:"min-width:0;"},
              el("h2",{style:"margin:0 0 4px;"}, blockTitle),
              el("div",{class:"muted small"}, "За "+periodLabel+" · розмов: "+groups.length)),
            el("button",{class:"btn btn-ghost","aria-label":"Закрити",title:"Закрити",style:"flex:none;width:36px;height:36px;padding:0;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;",onclick:()=>bg.remove()},"✕")),
          el("div",{class:"ov-all__list"}, groups.map(g => mkRow(g, ()=>bg.remove())))));
      document.body.appendChild(bg);
    };
    leftBlock.replaceChildren(
      el("div",{class:"section-title"}, el("span",{}, blockTitle)),
      el("div",{}, loading ? el("div",{class:"empty"}, "Завантаження…")
      : shown.length === 0
        ? el("div",{class:"empty"}, "За цей період проблемних моментів немає. Усе чисто.")
        : shown.map(g => mkRow(g))),
      ...((!loading && groups.length > 3)
        ? [el("button",{class:"btn btn-ghost",style:"width:100%;margin-top:10px;",onclick:openAll}, "Переглянути інші (+"+(groups.length-3)+")")]
        : [])
    );
  }
  paintLeft([], true);
  loadAnalyses(calls).then(list => { if (document.body.contains(leftBlock)) paintLeft(list,false); });

  const rightBlock = el("div",{class:"card"},
    el("div",{class:"section-title"},
      el("span",{},"Останні розмови"),
      el("span",{class:"muted small"}, "за "+periodLabel)),
    recent.length===0
      ? el("div",{class:"empty"}, "За цей період розмов ще немає.")
      : recent.map(c => {
          const mgr = userByEmail(c.managerEmail);
          const sc  = c.score;
          const sub = (c.client || c.title || "(без назви)") + " · " + fmtTimeRange(c.startedAt, c.durationSec, c.status) + (c.summary ? " · " + (c.summary.length>36?c.summary.slice(0,36)+"…":c.summary) : "");
          return el("div",{class:"recent-row", onclick:()=>{ location.hash = "#/calls/"+c.id; }},
            userAva(mgr),
            el("div",{style:"min-width:0;"},
              el("div",{class:"recent-row__name"}, mgr.name || mgr.email),
              el("div",{class:"recent-row__sub"}, sub)),
            el("div",{style:"justify-self:end;"}, statusBadge(c.status, false, c)),
            sc!=null ? scoreRing(sc, 44) : el("div",{})
          );
        })
  );

  root.replaceChildren(
    el("div",{class:"page-header"},
      el("h1",{class:"page-title"},"Огляд"),
      seg),

    el("div",{class:"muted", style:"margin-top:-10px;margin-bottom:var(--s-5);font-size:13px;"},
      "Показано за ", el("b",{style:"color:var(--text);"}, periodLabel) ,"."),

    el("div",{class:"ov-top", style:"grid-template-columns:repeat(3,1fr);"},
      kpiClickable("Розмов за період", String(calls.length), null, null, ()=>goToCalls({period, tab:"all"})),
      kpiClickable("Середня оцінка",   done.length ? avg+"%" : "—",                null, null, ()=>{ progressState.period=period; progressState.from=null; progressState.to=null; progressState.who="all"; saveProgressPref(); location.hash="#/progress"; }),
      kpiClickable("В обробці",         String(inWork.length),  inWork.length?{text:"!",kind:"warn"}:null, null, ()=>goToCalls({period, tab:"working"})),
    ),

    el("div",{class:"ov-blocks"}, leftBlock, rightBlock)
  );
}
function kpiClickable(title,value,badge,sub,onClick){
  const t=el("div",{class:"card__title"}, el("span",{},title));
  if (badge) t.append(el("span",{class:"kpi__badge"+(badge.kind==="danger"?" kpi__badge--danger":"")}, badge.text));
  const card = el("div",{class:"card card--pad-sm"+(onClick?" is-clickable":""), onclick:onClick||null}, t, el("div",{class:"kpi__value"},value));
  if (sub) card.appendChild(el("div",{class:"muted small",style:"margin-top:4px;"},sub));
  return card;
}

/* ========================================================
 *  Розмови
 * ======================================================== */
const CALL_TABS = [
  { key:"all",        label:"Усі",          match: c => true },
  { key:"mine",       label:"Мої",          mgrOnly:true, match: c => !!(activeUser && c.managerEmail===activeUser.email) },
  { key:"done",       label:"Готово",       match: c => c.status==="done" || c.status==="no_show" },
  { key:"live",       label:"В ефірі",      adminOnly:true, match: c => c.status==="live" },
  { key:"working",    label:"В роботі",     match: c => ["queued","ended","queued_for_analysis","transcribed","downloading","transcribing","analyzing"].includes(c.status) || (c.status==="live" && isMgrView()) },
  { key:"idle",       label:"Не оброблено", adminOnly:true, match: c => ["idle","canceled","skipped_short","error"].includes(c.status) },
];
// Тестові копії (порівняння моделей ШІ) живуть лише у вкладці «Тест» і не переходять в інші вкладки.
CALL_TABS.forEach(t => { const m = t.match; t.match = c => !c.isTest && m(c); });
function isMgrView(){ return !!(activeUser && activeUser.role===ROLES.MANAGER); }
function callTabs(){ return CALL_TABS.filter(t => (!t.adminOnly || !isMgrView()) && (!t.mgrOnly || isMgrView())); }
// Менеджер бачить розмови інших менеджерів, але діяти (запуск, скасування, ШІ-чат) може лише зі своїми
function canActOnCall(c){ return !!(activeUser && c && (activeUser.role!==ROLES.MANAGER || c.managerEmail===activeUser.email)); }
const callsState = { tab:(function(){ try{ return localStorage.getItem("alexa_calls_tab")||"all"; }catch(_){ return "all"; } })(), search:"", manager:"all", from:(function(){ const d=new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); })(), to:new Date(), limit:20 };  // за замовчуванням: поточний місяць

// Перехід у «Розмови» з уже виставленими фільтрами (з Огляду / Прогресу)
function saveCallsTab(){ try{ localStorage.setItem("alexa_calls_tab", callsState.tab); }catch(_){} }
function goToCalls(o){
  o = o || {};
  callsState.tab = o.tab || "all"; saveCallsTab();
  callsState.manager = o.manager || "all";
  callsState.search = "";
  callsState.limit = 20;
  if (o.period==="custom"){ callsState.from = o.from||null; callsState.to = o.to||null; }
  else if (o.period && o.period!=="all"){ callsState.from = periodStart(o.period); callsState.to = new Date(); }
  else { callsState.from = null; callsState.to = null; }
  location.hash = "#/calls";
}

function renderCalls(root){
  if (!callTabs().some(t=>t.key===callsState.tab) && !(callsState.tab==="admin_calls" && canSeeAdminCalls())) { callsState.tab = callTabs()[0].key; saveCallsTab(); }
  const tabCounts = {};
  callTabs().forEach(t => tabCounts[t.key] = callsAll().filter(t.match).length);

  const tabs = el("div",{class:"tabs"},
    callTabs().map(t => el("button",
      { class: t.key===callsState.tab?"is-active":"",
        onclick: () => { callsState.tab=t.key; saveCallsTab(); callsState.limit=20; renderCalls(root); } },
      t.label, el("span",{class:"tab-count","data-k":t.key}, String(tabCounts[t.key]))))
  );

  if (canSeeAdminCalls()){
    tabs.appendChild(el("button",{ class: callsState.tab==="admin_calls"?"is-active":"",
      onclick: () => { callsState.tab="admin_calls"; saveCallsTab(); renderCalls(root); } },
      "Розмови адміна", el("span",{class:"tab-count","data-k":"admin_calls"}, String(adminCallsAll().length))));
    if (callsState.tab==="admin_calls"){ renderAdminCallsView(root, tabs); return; }
  }
  const search = el("input",{type:"text",placeholder:"Пошук за клієнтом...",class:"input input--search",value:callsState.search,
    oninput:(e)=>{ callsState.search = e.target.value.toLowerCase(); updateList(); }});

  // Фільтр за менеджером: усі менеджери або конкретний (для менеджера теж)
  const mgrOptions = [{ value:"all", label:"Усі менеджери", name:"Усі менеджери", photoURL:null }].concat(
        managersList().map(m => ({ value:m.email, label:m.name||m.email, name:m.name, email:m.email, photoURL:m.photoURL||null }))
      );
  const mgrDD = dropdown({
    value: callsState.manager, options: mgrOptions,
    onChange: v => { callsState.manager=v; updateList(); },
    renderButton: o => el("span",{class:"dd__btn-left"},
      o.value==="all" ? el("div",{class:"ava ava--sm",style:"background:var(--surface-2);color:var(--text-muted);"}, ICONS.users()) : userAva(o,"sm"),
      el("span",{class:"dd__btn-label"}, o.label)),
    renderItem: o => el("div",{style:"display:flex;align-items:center;gap:10px;flex:1;"},
      o.value==="all" ? el("div",{class:"ava ava--sm",style:"background:var(--surface-2);color:var(--text-muted);"}, ICONS.users()) : userAva(o,"sm"),
      el("span",{}, o.label)),
  });

  // Styled date range
  const dateDD = dateRangeBtn({ start: callsState.from, end: callsState.to,
    defaultRange: () => { const d=new Date(); return { start:new Date(d.getFullYear(), d.getMonth(), 1), end:d }; },
    onChange: ({start,end}) => { callsState.from=start; callsState.to=end; updateList(); } });

  const addBtn = el("button",{class:"btn btn-primary", onclick:()=>{ location.hash = "#/calls/new"; }}, ICONS.plus(), "Додати розмову");

  const listWrap = el("div",{});
  // Auto-refresh when worker updates calls (store on window to dedupe across re-renders)
  if (window.__callsListener) window.removeEventListener(CALLS_CHANGED_EVT, window.__callsListener);
  let lastSig = callsSig();
  window.__callsListener = ()=>{
    const s = callsSig(); if (s === lastSig) return; lastSig = s;
    try { if (document.body.contains(root) && document.body.contains(listWrap)) updateList(); } catch(e){}
  };
  window.addEventListener(CALLS_CHANGED_EVT, window.__callsListener);

  function updateList(){
    const tabMatch = (callTabs().find(t=>t.key===callsState.tab)||callTabs()[0]).match;
    const from = callsState.from ? new Date(callsState.from.getFullYear(),callsState.from.getMonth(),callsState.from.getDate(),0,0,0) : null;
    const to   = callsState.to   ? new Date(callsState.to.getFullYear(),callsState.to.getMonth(),callsState.to.getDate(),23,59,59)    : null;
    const passBase = c => {
      if (callsState.manager!=="all" && c.managerEmail!==callsState.manager) return false;
      if (callsState.search && !(c.client||c.title||"").toLowerCase().includes(callsState.search)) return false;
      return true;
    };
    const inDates = c => {
      const t = new Date(c.startedAt).getTime();
      if (from && t<from.getTime()) return false;
      if (to && t>to.getTime()) return false;
      return true;
    };
    const base = callsAll().filter(c => passBase(c) && inDates(c));
    // «В роботі» — це те, що обробляється просто зараз: дата його не обмежує (інакше при вибраному «сьогодні» запущена вчорашня розмова зникала б)
    const workTab = CALL_TABS.find(t => t.key==="working");
    const working = callsAll().filter(c => passBase(c) && workTab.match(c));
    // счётчики вкладок = по тем же фильтрам (менеджер / поиск / дата), что и список; «В роботі» — без дати
    callTabs().forEach(t => {
      const n = tabs.querySelector('.tab-count[data-k="'+t.key+'"]');
      if (n) n.textContent = String(t.key==="working" ? working.length : base.filter(t.match).length);
    });
    { const an = tabs.querySelector('.tab-count[data-k="admin_calls"]'); if (an) an.textContent = String(adminCallsAll().filter(adminInRange).length); }
    const byStart = (a,b)=> new Date(b.startedAt)-new Date(a.startedAt);
    const list = (callsState.tab==="working" ? working : base.filter(tabMatch)).sort(byStart);

    listWrap.replaceChildren();
    if (list.length===0){
      listWrap.appendChild(el("div",{class:"calls-empty"}, "Нічого не знайдено за заданими фільтрами."));
      return;
    }

    const head = el("div",{class:"calls-head calls-grid"},
      el("div",{},"Дата / час"),
      el("div",{},"Менеджер"),
      el("div",{},"Клієнт"),
      el("div",{},"Діалог"),
      el("div",{},"Статус"),
      el("div",{style:"text-align:right;"},"Оцінка"),
      el("div",{},"")
    );
    listWrap.appendChild(head);

    for (const c of list.slice(0, callsState.limit)){
      const mgr = userByEmail(c.managerEmail);
      const score = c.score;
      const dur = c.durationSec ? fmtDur(c.durationSec) : null;
      const row = el("div",{class:"calls-row calls-grid", onclick: ()=>{ location.hash = "#/calls/"+c.id; }},
        el("div",{class:"calls-row__cell"},
          el("div",{style:"font-weight:500;"}, fmtDate(c.startedAt)),
          el("div",{class:"muted xs"}, fmtTimeRange(c.startedAt, c.durationSec, c.status))),
        el("div",{class:"calls-row__cell"},
          el("div",{style:"display:flex;align-items:center;gap:10px;min-width:0;"},
            userAva(mgr,"sm"),
            el("div",{class:"truncate",style:"font-weight:500;overflow:hidden;text-overflow:ellipsis;"}, mgr.name||mgr.email.split("@")[0]))),
        el("div",{class:"calls-row__cell truncate",style:"font-weight:500;"}, c.client || c.title || "(без назви)"),
        el("div",{class:"calls-row__cell truncate muted small"},
          (c.source==="youtube_watcher" ? "▶ YouTube" : "✎ Вручну") + (canActOnCall(c) ? " · " + (c.summaryShort || c.summary || c.errorReason || c.title || "—") : "")),
        el("div",{class:"calls-row__cell",style:"display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:visible;position:relative;"}, statusBadge(c.status, false, c),
          PROC_STATES.includes(c.status) ? el("span",{class:"muted xs", style:"font-variant-numeric:tabular-nums;", "data-lp":c.id}, progressPct(c)+"%") : null,
          PROC_STATES.includes(c.status) ? el("div",{class:"pbar pbar--mini"}, el("span",{style:"width:"+progressPct(c)+"%", "data-lpb":c.id})) : null,
          (aiAllowed() && canActOnCall(c) && ["idle","canceled","error","transcribed"].includes(c.status)) ? el("button",{class:"btn btn-primary btn-sm calls-act", title:(c.transcriptReady?"Зробити аналіз":"Почати аналіз"),
            onclick: async (e)=>{ e.stopPropagation(); const b=e.currentTarget; b.disabled=true;
              try { const ok = await startCallAnalysis(c); if (ok) toast("Передано на виконання","ok"); else b.disabled=false; }
              catch(ex){ toast(ex.code||ex.message||String(ex),"err"); b.disabled=false; } } }, "▶") : null,
          (canActOnCall(c) && ["queued","queued_for_analysis","ended","downloading","transcribing","analyzing"].includes(c.status)) ? el("button",{class:"btn btn-ghost btn-sm calls-act", title:"Скасувати",
            onclick: async (e)=>{ e.stopPropagation(); const b=e.currentTarget; if (!(await confirmStop(c))) return; b.disabled=true;
              try { const keep = await cancelCall(c); toast(keep ? "Скасовано — лишився попередній аналіз" : "Скасовано","ok"); }
              catch(ex){ toast(ex.code||ex.message||String(ex),"err"); b.disabled=false; } } }, "✕") : null),
        el("div",{class:"calls-row__cell",style:"display:flex;justify-content:flex-end;align-items:center;"}, score!=null ? scoreRing(score, 40) : el("span",{class:"muted"},"—")),
        el("div",{style:"color:var(--text-faint);text-align:right;"}, ICONS.chevronRight())
      );
      listWrap.appendChild(row);
    }
    if (list.length > callsState.limit){
      listWrap.appendChild(el("div",{style:"text-align:center;margin-top:12px;"},
        el("button",{class:"btn btn-ghost", onclick:()=>{ callsState.limit += 20; updateList(); }},
          "Показати ще (" + (list.length - callsState.limit) + ")")));
    }
  }

  root.replaceChildren(
    el("div",{class:"page-header"},
      el("h1",{class:"page-title"},"Розмови"),
      addBtn),
    el("div",{style:"margin-bottom:var(--s-4);"}, tabs),
    el("div",{class:"filters"}, search, mgrDD, dateDD),
    listWrap
  );
  updateList();
}


/* ========================================================
 *  Розмови адміна (для адмінів) — Zoom-зустрічі адміна з командою, без оцінювання
 * ======================================================== */
// «Розмови адміна»: власний фільтр, за замовчуванням — за весь час (старих розмов нема, лише нові)
const adminState = { search:"", from:null, to:null };
function adminInRange(c){
  if (adminState.search && !(c.client||c.title||"").toLowerCase().includes(adminState.search)) return false;
  const t = new Date(c.startedAt).getTime();
  if (adminState.from && t < new Date(adminState.from.getFullYear(),adminState.from.getMonth(),adminState.from.getDate(),0,0,0).getTime()) return false;
  if (adminState.to && t > new Date(adminState.to.getFullYear(),adminState.to.getMonth(),adminState.to.getDate(),23,59,59).getTime()) return false;
  return true;
}
function adminCallsAll(){
  const all = window.__adminCalls || [];
  if (activeUser && activeUser.role===ROLES.ADMIN){
    const me = String(activeUser.email||"").toLowerCase();
    return all.filter(c => String(c.managerEmail||"").toLowerCase()===me);
  }
  return all;
}
function findCallAny(id){ return callsAll().find(c => c.id===id) || adminCallsAll().find(c => c.id===id); }
function adminCallsSig(){ return adminCallsAll().map(c => [c.id,c.status,c.progress,c.stage,tsKey(c.updatedAt)].join(":")).join("|"); }
function renderAdminCallsView(root, tabs){
  const listWrap = el("div",{});
  const inFilter = adminInRange;
  function paint(){
    const fl = adminCallsAll().filter(inFilter).sort((x,y)=> new Date(y.startedAt)-new Date(x.startedAt));
    // лічильники звичайних вкладок — за фільтрами списку «Розмови» (місяць за замовчуванням)
    { const f0 = callsState.from ? new Date(callsState.from.getFullYear(),callsState.from.getMonth(),callsState.from.getDate(),0,0,0).getTime() : null;
      const e0 = callsState.to ? new Date(callsState.to.getFullYear(),callsState.to.getMonth(),callsState.to.getDate(),23,59,59).getTime() : null;
      callTabs().forEach(t => { const n = tabs.querySelector('.tab-count[data-k="'+t.key+'"]');
        if (n) n.textContent = String(callsAll().filter(c=>{ if(callsState.manager!=="all" && c.managerEmail!==callsState.manager) return false; if (t.key==="working") return true; const tt=new Date(c.startedAt).getTime(); return !(f0!=null&&tt<f0) && !(e0!=null&&tt>e0); }).filter(t.match).length); }); }
    const an = tabs.querySelector('.tab-count[data-k="admin_calls"]'); if (an) an.textContent = String(fl.length);
    const list = fl;
    listWrap.replaceChildren();
    if (!list.length && adminCallsAll().length){
      listWrap.appendChild(el("div",{class:"calls-empty"}, "Нічого не знайдено за заданими фільтрами."));
      return;

      pool.forEach(t => { const d = lev(nn, norm(t)); const lim = Math.max(1, Math.floor(Math.max(nn.length, norm(t).length)*0.15)); if (d<=lim){ if (d<bestD){ best=t; bestD=d; tie=false; } else if (d===bestD) tie=true; } });
      const r = (best && !tie) ? best : null; cache.set(ck, r); return r; };
    return { canon, order: union };
  };
  const critMapOf = (list, V) => { const m = new Map(); let stale = 0;
    list.forEach(({call,a}) => { if (!fullOk(call)) return;
      (a.criteria||[]).forEach(c => { const k=String(c.name||c.title||"").trim(); if (!k || c.score==null) return;
        let kk = k; if (V){ kk = V.canon(call, k); if (!kk){ stale++; return; } }
        const o=m.get(kk)||{sum:0,n:0}; o.sum+=Number(c.score)||0; o.n++; m.set(kk,o); }); });
    const r = new Map(); m.forEach((o,k)=>r.set(k,{ pct:Math.round(o.sum/o.n), n:o.n })); r.stale = stale; return r; };
  const staleNote = n => n>0 ? el("div",{class:"pm-stale"}, "Не враховано "+n+" "+plural(n,"оцінку","оцінки","оцінок")+" за критеріями, яких вже немає в скрипті (видалені чи сильно перейменовані). "+(isMgrRole ? "" : "Перезапусти аналіз цих розмов, щоб вони потрапили в статистику.")) : document.createDocumentFragment();
  const openManager = email => { progressState.who = email; saveProgressPref(); renderProgress(root); };
  const sortSt = progressState.sortSt || (progressState.sortSt = { key:"__avg", dir:"desc" });
  let showAllCols = !!progressState.allCols;

  const fill = (box, ...kids) => box.replaceChildren(...kids.filter(k => k!=null && k!==false));
  const insBox = el("div",{});          // підказки
  const mainCard = el("div",{class:"card"});   // карта команди або критерії
  let lastLists = null;

  function insCard(title, value, desc, onClick, tone){
    const c = el("div",{class:"card card--pad-sm pm-in"+(onClick?" is-click":"")+(tone?" pm-in--"+tone:""),

  function paintTeam(teamList, loading){
    const mgrs = managersList().filter(m => teamInP.some(c => c.managerEmail===m.email));
    const V = buildValid([teamList]);
    const byM = new Map(mgrs.map(m => [m.email, critMapOf(teamList.filter(x => x.call.managerEmail===m.email), V)]));
    const teamMap = critMapOf(teamList, V);
    const callsOf = email => teamInP.filter(c => c.managerEmail===email && fullOk(c));
    const avgOfEmail = email => { const sc = callsOf(email).filter(c=>typeof c.score==="number").map(c=>c.score); return sc.length ? Math.round(sc.reduce((a,b)=>a+b,0)/sc.length) : null; };
    // порядок — як у скрипті; критерії без жодної оцінки в колонки не потрапляють
    const allCrit = V.order.filter(k => teamMap.has(k)).concat([...teamMap.keys()].filter(k => !V.order.includes(k)));   // лише актуальні критерії, у порядку скрипта
    const cols = showAllCols ? allCrit : allCrit.slice(0,8);
    if (sortSt.key!=="__avg" && sortSt.key!=="__name" && !allCrit.includes(sortSt.key)){ sortSt.key="__avg"; sortSt.dir="desc"; }

    // --- підказки ---
    const have = k => mgrs.map(m => ({ m, v: (byM.get(m.email)||new Map()).get(k) })).filter(x=>x.v);
    let weakAll = null;
    allCrit.forEach(k => { const h = have(k); if (h.length<2) return; const below = h.filter(x=>x.v.pct<65).length, share = below/h.length;
      if (share>=0.5 && teamMap.get(k).pct<65){ if (!weakAll || share>weakAll.share || (share===weakAll.share && teamMap.get(k).pct<weakAll.pct)) weakAll = { k, share, below, total:h.length, pct:teamMap.get(k).pct }; } });
    // «Потрібна допомога»: усі пари менеджер·критерій, де відставання від команди ≥10 пунктів (від 2 оцінок); для кожного — хто може допомогти
    const problems = [];
    allCrit.forEach(k => have(k).forEach(x => { if (x.v.n<2) return; const gap = teamMap.get(k).pct - x.v.pct; if (gap>=10) problems.push({ k, m:x.m, v:x.v.pct, team:teamMap.get(k).pct, gap }); }));
    problems.sort((a,b)=>b.gap-a.gap);
    const helpersFor = (k, exceptEmail) => have(k).filter(x => x.v.n>=2 && x.v.pct>=70 && x.m.email!==exceptEmail).sort((a,b)=>b.v.pct-a.v.pct).slice(0,2).map(x => ({ m:x.m, v:x.v.pct }));
    problems.forEach(pr => { pr.helpers = helpersFor(pr.k, pr.m.email); });
    const nameOf = m => m.name || m.email;
    // найсильніше в команді
    let bestCrit = null;
    allCrit.forEach(k => { const h = have(k).filter(x=>x.v.n>=2); if (h.length<1 || teamMap.get(k).n<3) return; const t = teamMap.get(k).pct; if (!bestCrit || t>bestCrit.pct) { const lead = h.slice().sort((a,b)=>b.v.pct-a.v.pct)[0]; bestCrit = { k, pct:t, lead }; } });
    const goSort = k => { if (!cols.includes(k)){ showAllCols = true; progressState.allCols = true; } sortSt.key = k; sortSt.dir = "asc"; paintTeam(...lastLists); setTimeout(()=>mainCard.scrollIntoView({behavior:"smooth",block:"start"}),0); };
    const openHelpModal = () => {
      const bg = el("div",{class:"modal-bg", onclick:(ev)=>{ if (ev.target===bg) bg.remove(); }});
      const go = email => { bg.remove(); openManager(email); };
      const body = el("div",{class:"pm-help"});
      if (weakAll){
        const hs = helpersFor(weakAll.k, null);
        body.appendChild(el("div",{class:"pm-help__it pm-help__it--all"},
          el("div",{class:"pm-help__t"}, "Слабко в усіх · ", el("b",{}, weakAll.k)),
          el("div",{class:"pm-help__d"}, "Середній бал "+weakAll.pct+"%: у "+weakAll.below+" з "+weakAll.total+" "+plural(weakAll.total,"менеджера","менеджерів","менеджерів")+" нижче 65%."),
          hs.length ? el("div",{class:"pm-help__h"}, "Приклад для команди: ", hs.map(h => el("button",{class:"pm-chip", type:"button", onclick:()=>go(h.m.email)}, nameOf(h.m)+" · "+h.v+"%"))) : null));
      }
      problems.forEach(pr => body.appendChild(el("div",{class:"pm-help__it"},
        el("div",{class:"pm-help__t"},
          el("button",{class:"pm-chip pm-chip--weak", type:"button", onclick:()=>go(pr.m.email)}, nameOf(pr.m)),
          el("span",{class:"pm-help__k"}, pr.k)),
        el("div",{class:"pm-help__d"}, pr.v+"% при "+pr.team+"% у команди ("+"−"+pr.gap+" п.)"),
        el("div",{class:"pm-help__h"}, "Допоможе: ", pr.helpers.length ? pr.helpers.map(h => el("button",{class:"pm-chip", type:"button", onclick:()=>go(h.m.email)}, nameOf(h.m)+" · "+h.v+"%")) : el("span",{class:"muted"}, "поки немає прикладу (потрібно 70%+ і 2 оцінки)")))));
      if (!problems.length && !weakAll) body.appendChild(el("div",{class:"empty"}, "Помітних провалів немає."));

        el("h2",{}, "Кому потрібна допомога"),
        el("div",{class:"muted xs", style:"margin:-8px 0 12px;"}, "Відставання від команди 10 і більше пунктів, від 2 оцінок. Клік по імені відкриває менеджера."),
        body,
        el("div",{class:"modal-actions"}, el("button",{class:"btn btn-primary", onclick:()=>bg.remove()}, "Закрити"))));
      document.body.appendChild(bg);
    };

    const np = problems.length;
    fill(insBox,el("div",{class:"pm-ins"},
      weakAll ? insCard("Слабко в усіх", weakAll.k, "Середній бал "+weakAll.pct+"%: у "+weakAll.below+" з "+weakAll.total+" "+plural(weakAll.total,"менеджера","менеджерів","менеджерів")+" нижче 65%", ()=>goSort(weakAll.k), "low")
              : insCard("Слабко в усіх", "Спільної слабкої зони немає", loading ? "Рахую…" : "Жоден критерій не просідає одразу в більшості менеджерів", null, "ok"),
      np ? insCard("Потрібна допомога", np+" "+plural(np,"випадок","випадки","випадків")+" · "+nameOf(problems[0].m)+" · "+problems[0].k,
              (problems[0].helpers.length ? "Допоможе: "+nameOf(problems[0].helpers[0].m)+" ("+problems[0].helpers[0].v+"%)" : "Поки немає прикладу")+(np>1 ? " · ще "+(np-1) : "")+" — натисни, щоб побачити всіх", openHelpModal, "mid")
         : insCard("Потрібна допомога", "Помітних провалів немає", loading ? "Рахую…" : "Нікого не видно нижче команди на 10 і більше пунктів (потрібно від 2 оцінок)", weakAll ? openHelpModal : null, "ok"),
      bestCrit ? insCard("Найсильніше в команді", bestCrit.k, "Середній бал "+bestCrit.pct+"%"+(bestCrit.lead ? " · найкращий: "+nameOf(bestCrit.lead.m)+" ("+bestCrit.lead.v.pct+"%)" : ""), bestCrit.lead ? ()=>openManager(bestCrit.lead.m.email) : null, "ok")
               : insCard("Найсильніше в команді", "—", loading ? "Рахую…" : "Поки замало оцінок", null)));

    // --- карта ---
    const rowsData = mgrs.map(m => ({ m, avg:avgOfEmail(m.email), n:callsOf(m.email).length, map:byM.get(m.email) }));
    const val = (r) => sortSt.key==="__avg" ? r.avg : sortSt.key==="__name" ? null : (r.map.get(sortSt.key)||{}).pct;
    rowsData.sort((a,b) => {
      if (sortSt.key==="__name") return (a.m.name||a.m.email).localeCompare(b.m.name||b.m.email, "uk") * (sortSt.dir==="asc"?1:-1);
      const x=val(a), y=val(b); if (x==null && y==null) return 0; if (x==null) return 1; if (y==null) return -1;
      return sortSt.dir==="asc" ? x-y : y-x; });
    const arrow = k => sortSt.key===k ? (sortSt.dir==="asc" ? " ▲" : " ▼") : "";
    const sortBy = (k, firstDir) => { if (sortSt.key===k) sortSt.dir = sortSt.dir==="asc" ? "desc" : "asc"; else { sortSt.key=k; sortSt.dir=firstDir||"desc"; } paintTeam(...lastLists); };
    const head = (k, text, title, firstDir) => el("button",{class:"pm-h"+(sortSt.key===k?" is-on":""), type:"button", title: title||text, onclick:()=>sortBy(k, firstDir)}, text+arrow(k));
    const cell = (v, title, onClick) => v ? el("button",{class:"pm-c pm-"+lvl(v.pct)+(v.n<3?" pm-dim":""), type:"button", title: title+" · "+v.pct+"% · "+v.n+" "+plural(v.n,"розмова","розмови","розмов")+(v.n<3?" (мало даних)":""), onclick:onClick}, String(v.pct))
                    : el("span",{class:"pm-c pm-na", title: title+": даних немає"}, "—");
    const grid = el("div",{class:"pm-tbl", style:"--n:"+cols.length});
    const hdr = [ head("__name","Менеджер","Сортувати за іменем","asc"), el("span",{class:"pm-h",title:"Повних розмов у періоді"},"Розм."), head("__avg","Сер.","Середня оцінка повних діагностик") ].concat(cols.map(k => head(k,k,k+" — клік сортує","asc")));
    hdr.forEach(h => grid.appendChild(h));
    // рядок команди
    const tAvg = (function(){ const sc = teamInP.filter(c=>fullOk(c)&&typeof c.score==="number").map(c=>c.score); return sc.length ? Math.round(sc.reduce((a,b)=>a+b,0)/sc.length) : null; })();
    grid.appendChild(el("div",{class:"pm-nm pm-team"}, el("span",{class:"ava ava--sm",style:"background:var(--brand-soft);color:var(--brand);"}, ICONS.users()), el("span",{class:"pm-nm__w"}, el("span",{class:"pm-nm__t"},"Команда"), el("span",{class:"pm-nm__c"}, teamInP.filter(fullOk).length+" "+plural(teamInP.filter(fullOk).length,"розмова","розмови","розмов")))));
    grid.appendChild(el("span",{class:"pm-n pm-team"}, String(teamInP.filter(fullOk).length)));
    grid.appendChild(tAvg!=null ? el("span",{class:"pm-c pm-"+lvl(tAvg)+" pm-team"}, String(tAvg)) : el("span",{class:"pm-c pm-na"},"—"));
    cols.forEach(k => { const v = teamMap.get(k); grid.appendChild(v ? el("span",{class:"pm-c pm-"+lvl(v.pct)+" pm-team", title:k+" · команда · "+v.pct+"% · "+v.n+" "+plural(v.n,"оцінка","оцінки","оцінок")}, String(v.pct)) : el("span",{class:"pm-c pm-na"},"—")); });
    grid.appendChild(el("div",{class:"pm-sep"}));
    rowsData.forEach(r => {

      el("span",{}, el("i",{style:"background:var(--success)"}), "80+"), el("span",{}, el("i",{style:"background:var(--warn)"}), "60–79"), el("span",{}, el("i",{style:"background:var(--danger)"}), "до 60"),
      el("span",{class:"muted xs"}, "блідіша клітинка — менше 3 розмов"));
