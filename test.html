      el("div",{class:"section-title"}, el("span",{},"Карта команди"), el("span",{class:"muted xs pm-sub"}, "повні діагностики · клік по рядку відкриває менеджера")),
      legend,
      el("div",{class:"pm-hint"}, "← гортай таблицю вбік →"),
      staleNote(teamMap.stale),
      !rowsData.length ? el("div",{class:"empty"}, loading ? "Завантаження…" : "За цей період розмов немає.")
        : el("div",{class:"pm-scroll"}, grid),
      (allCrit.length>8) ? el("button",{class:"btn btn-ghost btn-sm", style:"margin-top:12px;", onclick:()=>{ showAllCols=!showAllCols; progressState.allCols=showAllCols; paintTeam(...lastLists); }}, showAllCols ? "Лише головні критерії" : "Усі критерії ("+allCrit.length+")") : null);
  }

  function paintPersonal(teamList, prevList, loading){
    const mineList = isManager ? teamList : teamList.filter(x => x.call.managerEmail===who);
    const V = buildValid([teamList, prevList||[]]);
    const mine = critMapOf(mineList, V);
    const marker = isManager ? critMapOf(prevList||[], V) : critMapOf(teamList, V);
    const mkLabel = isManager ? "мій минулий період" : "середнє по команді";
    const rows = [...mine.entries()].map(([k,v]) => ({ k, v, mk: marker.get(k)||null })).sort((a,b)=>a.v.pct-b.v.pct || a.k.localeCompare(b.k));
    const best = rows.length ? rows[rows.length-1] : null, worst = rows.length ? rows[0] : null;
    fill(insBox,el("div",{class:"pm-ins pm-ins--two"},
      worst ? insCard("Що підтягнути", worst.k, worst.v.pct+"% · "+worst.v.n+" "+plural(worst.v.n,"оцінка","оцінки","оцінок"), null, lvl(worst.v.pct)==="ok"?"ok":lvl(worst.v.pct)) : insCard("Що підтягнути", "—", loading ? "Рахую…" : "Немає розібраних розмов за цей період", null),
      best ? insCard("Що виходить найкраще", best.k, best.v.pct+"% · "+best.v.n+" "+plural(best.v.n,"оцінка","оцінки","оцінок"), null, "ok") : insCard("Що виходить найкраще", "—", loading ? "Рахую…" : "Немає розібраних розмов за цей період", null)));
    const open = progressState.critOpen;
    const shown = open ? rows : rows.slice(0,8);
    fill(mainCard,
      el("div",{class:"section-title"}, el("span",{}, isManager ? "Мої критерії" : "Критерії менеджера"), el("span",{class:"muted xs pm-lg"}, el("i",{class:"pm-mk-i"}), " "+mkLabel)),
      staleNote(mine.stale),
      shown.length ? el("div",{}, shown.map(r => {
        const d = r.mk ? r.v.pct - r.mk.pct : null;
        const tip = r.k+" · "+r.v.pct+"% ("+r.v.n+" "+plural(r.v.n,"оцінка","оцінки","оцінок")+")"+(r.mk ? " · "+mkLabel+": "+r.mk.pct+"%" : " · "+mkLabel+": немає даних");
        return el("div",{class:"pp-row", title:tip},
          el("div",{class:"pp-top"},
            el("span",{class:"pp-name"}, r.k),
            el("span",{class:"pp-right"},
              d==null ? null : el("span",{class:"pp-d", style:"color:"+(d>0?"var(--success)":d<0?"var(--danger)":"var(--text-muted)")+";"}, d>0?"▲ +"+d : d<0?"▼ "+d : "= 0"),
              el("b",{style:"color:"+colOf(r.v.pct)+";"}, r.v.pct+"%"))),
          el("div",{class:"pp-bar"}, el("i",{style:"width:"+r.v.pct+"%;background:"+colOf(r.v.pct)+";"}), r.mk ? el("span",{class:"pp-mk", style:"left:"+r.mk.pct+"%;"}) : null));
      }).concat(rows.length>8 ? [el("button",{class:"btn btn-ghost btn-sm", style:"margin-top:10px;", onclick:()=>{ progressState.critOpen=!open; paintPersonal(teamList, prevList, false); }}, open ? "Згорнути" : "Показати решту ("+(rows.length-8)+")")] : []))
        : el("div",{class:"empty"}, loading ? "Завантаження…" : "За цей період немає оцінок по критеріях."));
  }

  function paint(teamList, prevList, loading){
    lastLists = [teamList, prevList, loading];
    if (teamMode) paintTeam(teamList, loading); else paintPersonal(teamList, prevList, loading);
  }
  (function(){ lastLists = [[], [], true]; if (teamMode) paintTeam([], true); else paintPersonal([], [], true); })();
  Promise.all([loadAnalyses(teamInP), loadAnalyses(data.prevCalls), isMgrRole ? Promise.resolve(null) : scriptsAll().catch(()=>null)]).then(([tl, pl, sm]) => {
    if (!document.body.contains(mainCard)) return;
    scriptsMapRef = sm && Object.keys(sm).length ? sm : null;
    lastLists = [tl, pl, false]; paint(tl, pl, false); });

  const backBtn = (!isManager && !teamMode) ? el("button",{class:"btn btn-ghost btn-sm", type:"button", onclick:()=>{ progressState.who="all"; saveProgressPref(); renderProgress(root); }}, "← Уся команда") : null;

  root.replaceChildren(
    el("div",{class:"page-header"},
      el("div",{style:"display:flex;align-items:center;gap:12px;flex-wrap:wrap;"}, backBtn, el("h1",{class:"page-title"}, title)),
      el("div",{style:"display:flex;gap:10px;align-items:center;flex-wrap:wrap;"},
        picker, dateDD, periodSeg,
        isMgrRole ? null : el("button",{class:"btn btn-primary", type:"button", title:"Глибокий аналіз розмов і порівняння менеджерів", onclick:()=>openAnalysisModal()}, ICONS.brain(), "Аналіз"))),

    el("div",{class:"muted", style:"margin-top:-10px;margin-bottom:var(--s-5);font-size:13px;"},
      "Показано ", el("b",{style:"color:var(--text);"}, whoLabel), " за ", el("b",{style:"color:var(--text);"}, periodLbl), "."),

    el("div",{class:"ov-top", style:"grid-template-columns:repeat(3,1fr);"},
      kpiClickable("Розмов", String(data.callsCount), null, "за "+periodLbl, ()=>goToCalls({period:progressState.period, from:progressState.from, to:progressState.to, manager: isManager?"all":who, tab:"all"})),
      (function(){
        const t=el("div",{class:"card__title"}, el("span",{},"Середня оцінка"));
        return el("div",{class:"card card--pad-sm"}, t,
          el("div",{class:"kpi__value", style:"color:"+(data.avgScore?scoreColor:"var(--text-muted)")+";"}, data.avgScore ? data.avgScore+"%" : "—"),
          el("div",{class:"muted small",style:"margin-top:4px;"},"по готових розмовах"));

          el("div",{class:"muted small",style:"margin-top:4px;"},"динаміка"));

const DEFAULT_AI_RULES = "- «ТРЕБА ПОДУМАТИ» / «ПОРАДИТИСЬ». Це нормальна реакція клієнта, особливо коли вона радиться з близькими (донька, чоловік, партнер, колеги). Відпустити клієнта подумати — НЕ помилка і не привід для суворої оцінки: не став \"critical\", не лай менеджера за те, що він не тиснув і не закрив на бронь «просто зараз». Але й не ігноруй цей момент зовсім. Якщо було що покращити, зафіксуй ОДНЕ м'яке слабке місце severity \"warn\" з таймкодом і тоном поради, а не докору. Типові приклади: не уточнив, над чим саме вона хоче подумати; не запропонував зафіксувати бронь чи ціну як безпечний крок; не домовився про конкретний час наступного контакту; не з'ясував, що вирішує саме та людина, з якою вона радиться. Якщо менеджер це зробив — нічого не пиши. Бал за закриття через це знижуй помірно (до 5–10 балів), не більше.\n- КЕЙСИ. Кейс схожого клієнта потрібен лише для заперечень про результат у середині розмови («чи спрацює у мене», «чи вийде», сумнів у результаті). НЕ вимагай кейс: на етапі закриття, під час презентації тарифів, цін і броні, на запереченнях «треба подумати / порадитись», «дорого», «немає часу». Відсутність кейса в таких місцях не є слабким місцем і не причина знижувати оцінку.\n- Менеджера НЕ оцінюємо за те, що він не перевірив, чи є в клієнта час на розмову: клієнта про тривалість попереджають заздалегідь. Не згадуй це ні в оцінках, ні в слабких місцях.\n- Цифри прогнозу, конверсій і доходу, які менеджер називає у фінмоделі (наприклад «60–70% заходять у роботу після міні-продукту»), — власні орієнтири команди. Це нормально; не знижуй бал за «непідтверджений прогноз». Якщо менеджер зрозуміло пояснив фінмодель (структуру доходу й орієнтири) і клієнт її прийняв, критерій про фінмодель оцінюй 80–95; нижче — лише коли фінмоделі не було або вона лишилась незрозумілою.\n- У продукті замовника НЕМАЄ групової роботи: усе — 1 на 1. Якщо в розмові йдеться про групи чи групові заняття, це формат, який клієнт пропонуватиме СВОЇМ клієнтам, а не те, що продає менеджер. Не пиши, що менеджер «запланував» чи «запропонував» груповий формат.\n- Розмова, де менеджер пройшов усі етапи структури й закрив клієнта на завдаток чи оплату, — зразкова: оцінки здебільшого 90–100, слабких місць зазвичай немає. Не шукай недоліки там, де їх нема.\n- Назви пакетів і тарифів (Швидкий старт, Silver, Big Money тощо) пиши ТІЛЬКИ якщо їх назвали в розмові. Назви зі скрипта в аналіз не переноси.\n- Рід менеджера (він чи вона) визнач за іменем з розмови й тримай один по всьому тексту; не знаєш — пиши нейтрально («менеджер провів»).\n- Якщо клієнт прямо сказав, що вирішить пізніше чи після розмови з партнером і оплати ще не було, готовність не вище 75.\n- У оцінках і слабких місцях не згадуй тривалість розмови, не пиши «за описом» чи «за скриптом» і не посилайся на ці правила. Не критикуй менеджера за затримку чи відсутність другого учасника на початку, якщо не він її спричинив.";
function scriptDefault(pkgKey, fmt){
  const b = SCRIPT_BASE[fmt] || SCRIPT_BASE.sales;
  return { text: b.text + "\n\n" + (SCRIPT_PRODUCTS[pkgKey]||""), criteria: b.criteria.map(c=>Object.assign({},c)), format: fmt, pkgKey: pkgKey, aiRules: (fmt==="individual" ? "- Це індивідуальний запит: людина прийшла не купувати менторство, а з власною професійною ситуацією й проханням до команди. Не оцінюй ціни, фінмодель, пакети, завдаток, бронь і закриття на оплату, і не став їх відсутність слабким місцем.\n- Головне: чи лід кваліфікований (ніша, аудиторія, продукти, дохід, цілі, готовність інвестувати); чи менеджер повноцінно з'ясував запит і його причину (що потрібно, навіщо, який результат, що вже пробувала, обмеження), щоб експерт підготував пропозицію без повторних питань; чи є чіткий наступний крок (хто, що і коли надішле).\n- Якщо домовлено про пропозицію текстом — результат «follow_up». У підсумку коротко й по суті: хто людина, що має, який запит, чим завершилось.\n- Слабкі місця — лише реальні: не з'ясував важливе (аудиторія, досвід запусків, поточний дохід і ціль, що вже пробувала, бюджет чи готовність платити), не уточнив причину запиту, не підсумував запит наприкінці, не назвав чіткий термін відповіді." : DEFAULT_AI_RULES), version:0 };
}
const scriptsState = { selected: "quick_start" };

// Усі скрипти тримаємо в пам'яті через одну підписку (onSnapshot): сторінка «Скрипти» більше не читає базу при кожному вході,
// а нові зміни (свої й чужі) приходять самі. Підписка стартує при першому відкритті сторінки.
const scriptsStore = { map:null, unsub:null, waiters:[] };
function startScriptsSubscription(){
  if (scriptsStore.unsub) return;
  try {
    scriptsStore.unsub = db.collection("scripts").onSnapshot(sn=>{
      const m = {}; sn.forEach(d=>{ m[d.id] = d.data()||{}; });
      scriptsStore.map = m;
      const w = scriptsStore.waiters.splice(0); w.forEach(f=>f(m));
    }, err=>{
      console.warn("scripts subscribe:", err);
      try { scriptsStore.unsub && scriptsStore.unsub(); } catch(_){}
      scriptsStore.unsub = null;
      const w = scriptsStore.waiters.splice(0); w.forEach(f=>f(scriptsStore.map || {}));
    });
  } catch(ex){ console.warn(ex); }
}
function scriptsPatchLocal(id, obj){ if (scriptsStore.map) scriptsStore.map[id] = Object.assign({}, scriptsStore.map[id]||{}, obj); }
function stopScriptsSubscription(){ try { scriptsStore.unsub && scriptsStore.unsub(); } catch(_){} scriptsStore.unsub=null; scriptsStore.map=null; }
function scriptsAll(){
  if (scriptsStore.map) return Promise.resolve(scriptsStore.map);
  return new Promise(res=>{
    scriptsStore.waiters.push(res);
    startScriptsSubscription();
    setTimeout(()=>{ const i = scriptsStore.waiters.indexOf(res); if (i>=0){ scriptsStore.waiters.splice(i,1); res(scriptsStore.map||{}); } }, 8000);
  });
}
async function loadScript(packageKey){
  const m = await scriptsAll();
  return m[packageKey] ? JSON.parse(JSON.stringify(m[packageKey])) : null;
}
async function saveScript(packageKey, pkgName, data, actorUid){
  const payload = {
    name: String(pkgName || packageKey),
    text: String((data && data.text) || ""),
    aiRules: String((data && data.aiRules) != null ? data.aiRules : ""),
    ...((data && data.custom) ? { custom:true, productHint:String(data.productHint||""), short:String(data.short||"Додатковий продукт") } : {}),
    format: String((data && data.format) || "sales"),
    pkgKey: String((data && data.pkgKey) || packageKey),
    criteria: ((data && data.criteria) || []).map(c => ({
      title:       String(c && c.title       || ""),
      description: String(c && c.description || ""),
      weight:      Number(c && c.weight      || 0),
    })),
    updatedBy: actorUid || null,
    updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
  };
  try {
    await db.collection("scripts").doc(packageKey).set(payload);
    scriptsPatchLocal(packageKey, payload);
  } catch (ex) {
    console.error("saveScript set failed:", ex, "payload:", payload);
    throw ex;
  }
}

// Фото: файл (перетягни або вибери) стискається до 256px і зберігається в профілі; можна й URL
function fileToAvatar(file){
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Потрібна картинка (jpg, png, webp)."));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Не вдалося прочитати файл."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("Не вдалося відкрити картинку."));
      img.onload = () => {
        const S = 256, side = Math.min(img.width, img.height);
        const cv = document.createElement("canvas"); cv.width = cv.height = S;
        cv.getContext("2d").drawImage(img, (img.width-side)/2, (img.height-side)/2, side, side, 0, 0, S, S);
        resolve(cv.toDataURL("image/jpeg", 0.85));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

            const okR = await confirmModal("Відновити «"+(u.name||u.email).replace(" (видалений)","")+"»?", "Користувач знову зможе заходити на сайт зі своїм поточним паролем і роллю «"+(ROLE_LABEL_UK[u.role]||u.role)+"».", "Так, відновити");
            if (!okR) return;

          (canActOn(actor,u) && u.role===ROLES.MANAGER && n>0) ? el("button",{class:"btn btn-danger-outline btn-sm", onclick:()=>openPurgeModal(u, n, refresh)}, "Очистити історію") : null,
          (canActOn(actor,u) && !(u.role===ROLES.MANAGER && n>0)) ? el("button",{class:"btn btn-danger-outline btn-sm", onclick: async ()=>{
            const ok = await confirmModal("Прибрати «"+u.name.replace(" (видалений)","")+"» повністю?",
              "Акаунт входу й запис менеджера буде видалено назавжди — той самий email можна буде створити заново."+(n ? " Його розмови ("+n+" шт.) ЛИШАТЬСЯ, але без імені — лише з поштою. Якщо вони не потрібні, спочатку натисни «Очистити історію»." : ""), "Так, прибрати повністю");
            if (!ok) return;
            try { await requestDeleteUserFull(u.email); logAction("remove_user_fully", null, u.email); toast("Передано на виконання — акаунт зникне, щойно задача виконається","ok"); setTimeout(refresh, 6000); }
            catch(ex){ toast(ex.code||ex.message||String(ex),"err"); } }}, "Прибрати повністю") : null);
      })) : document.createDocumentFragment()
  );
  }
  root.replaceChildren(
    el("div",{class:"page-header"},
      el("h1",{class:"page-title"},"Користувачі"),
      canCreate ? el("button",{class:"btn btn-primary", onclick:()=>openCreateUserModal(actor,(res)=>{
        alert("Створено "+res.email+" · "+ROLE_LABEL_UK[res.role]+"\nТимчасовий пароль: "+res.pass+"\nПередай користувачу — хай зайде і одразу поміняє.");
        refresh();
      })}, ICONS.plus(),"Додати користувача") : null),
    el("div",{class:"filters"}, searchEl),
    listWrap
  );
  paintList();
}

function openPurgeModal(u, n, after){
  const inp = el("input",{type:"text",placeholder:"Напиши: ВИДАЛИТИ"});
  const err = el("div",{class:"login-err"});
  const bg = el("div",{class:"modal-bg", onclick:(e)=>{ if (e.target===bg) bg.remove(); }},
    el("div",{class:"modal", style:"max-width:440px;"},
      el("h2",{},"Стерти всю історію менеджера?"),
      el("div",{style:"margin:6px 0 12px;line-height:1.5;color:var(--text-muted);font-size:14px;"},
        "Усі розмови «"+u.name+"» ("+n+" шт.) з розшифровками, аналізами й чатами буде видалено НАЗАВЖДИ. Повернути їх неможливо."),
      el("div",{class:"modal-row"}, el("label",{},"Для підтвердження"), inp), err,
      el("div",{class:"modal-actions"},
        el("button",{class:"btn btn-ghost",onclick:()=>bg.remove()},"Скасувати"),
        el("button",{class:"btn btn-danger-outline", onclick: async (e)=>{
          if (inp.value.trim().toUpperCase()!=="ВИДАЛИТИ"){ err.textContent="Напиши слово ВИДАЛИТИ."; return; }
          e.target.disabled=true;
          try { await requestPurgeManager(u.email); logAction("purge_history", null, u.email+" ("+n+" розмов)"); bg.remove(); toast("Передано на виконання — розмови зникнуть, щойно задача виконається","ok"); after&&after(); }
          catch(ex){ err.textContent=ex.code||ex.message||String(ex); e.target.disabled=false; }
        }},"Стерти назавжди"))));
  document.body.appendChild(bg);
}

/* ========================================================
 *  Налаштування
 * ======================================================== */
function renderSettings(root){
  const workerChip = el("span",{class:"chip chip--error"},"Перевіряю...");
  const workerInfo = el("div",{class:"muted small",style:"line-height:1.5;"},"");
  const srvInfo = el("div",{style:"display:flex;flex-direction:column;gap:8px;margin-top:8px;"});
  (function(){   // авто-обслуговування сервера: health/server (пише сам сервер раз на зміну / раз на годину)
    let x = null, loaded = false;
    function paintSrv(){
      srvInfo.textContent = "";
      const add = (bg,fg,title,cause,action)=>{
        srvInfo.appendChild(el("div",{style:"border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5;background:"+bg+";color:"+fg+";"},
          el("div",{style:"font-weight:700;"},title),
          cause ? el("div",{style:"margin-top:2px;"},"Причина: "+cause) : null,
          action ? el("div",{style:"margin-top:2px;"},"Що робити: "+action) : null));
      };
      if (!loaded) return;
      if (!x){ add("var(--surface-2)","var(--text-muted,inherit)","Автоперевірка сервера ще не звітувала","Служба обслуговування ще не запускалась.","Якщо так довго — RUNBOOK, сценарій 6."); return; }
      const ts = x.checkedAt && x.checkedAt.toDate ? x.checkedAt.toDate() : null;
      const ageH = ts ? (Date.now()-ts.getTime())/3600000 : null;
      if (ageH!==null && ageH>3){
        add("var(--danger-soft)","var(--danger)","Автоперевірка сервера не звітує вже "+Math.floor(ageH)+" год.",
          "Сервер вимкнений або без інтернету, зупинена служба обслуговування, або не оплачено сервер Contabo.","Спершу перевір оплату: my.contabo.com → Billing (чи продовжено VPS, чи діє картка). Потім що VPS у стані Running; далі RUNBOOK, сценарій 6.");
      }
      const list = Array.isArray(x.issues) ? x.issues : [];
      list.forEach(it=>{
        const bad = it.level==="error";
        add(bad?"var(--danger-soft)":"var(--warn-soft)", bad?"var(--danger)":"var(--warn)", it.title||"Проблема", it.cause, it.action);
      });
      if (!list.length && !(ageH!==null && ageH>3)){
        add("var(--surface-2)","var(--text-muted,inherit)","Усе працює"+(ts ? " · перевірено "+ts.toLocaleString("uk-UA",{hour:"2-digit",minute:"2-digit",day:"2-digit",month:"2-digit"}) : ""),
          "", "");
        if (x.lastFix) srvInfo.lastChild.appendChild(el("div",{style:"margin-top:2px;font-weight:400;"},"Сервер сам усунув несправність: "+x.lastFix));
      }
      { // історія подій: що з'являлось і зникало (пише сервер, останні 40)
        const log = Array.isArray(x.log) ? x.log.filter(e=>{ const ms = Date.parse(e && e.ts); return !ms || (Date.now()-ms) <= ((e.level==="error" ? 5 : 3)*86400000); }).reverse() : [];   // самоочистка: жовті старші за 3 доби і червоні старші за 5 діб не показуємо
        const fmtT = iso => { try { return new Date(iso).toLocaleString("uk-UA",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"}); } catch(_){ return iso; } };
        const openHist = ()=>{
          const body = el("div",{style:"display:flex;flex-direction:column;gap:8px;max-height:min(60vh,340px);overflow-y:auto;margin:10px 0 14px;padding-right:6px;"});
          if (!log.length) body.appendChild(el("div",{class:"muted small"},"Подій поки не було — запис почнеться з наступної несправності."));
          log.forEach(e => {
            const col = e.kind==="end" ? "var(--success)" : (e.level==="error" ? "var(--danger)" : "var(--warn)");
            body.appendChild(el("div",{style:"flex:none;display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.45;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);"},
              el("span",{style:"flex:none;width:8px;height:8px;border-radius:50%;margin-top:5px;background:"+col+";"}),
              el("div",{style:"min-width:0;"},
                el("div",{}, el("span",{class:"muted xs"}, fmtT(e.ts)+" · "), e.kind==="end" ? "Усунено: "+e.title : e.title),
                (e.kind!=="end" && e.cause) ? el("div",{class:"muted xs",style:"overflow-wrap:anywhere;"}, e.cause) : null)));
          });
          const bg = el("div",{class:"modal-bg", onclick:(ev)=>{ if (ev.target===bg) bg.remove(); }},
            el("div",{class:"modal", style:"max-width:560px;"},
              el("h2",{}, "Історія подій сервера"),
              body,
              el("div",{class:"modal-actions"}, el("button",{class:"btn btn-primary", onclick:()=>bg.remove()}, "Закрити"))));
          document.body.appendChild(bg);
        };
        const cnt = list.length;
        srvInfo.appendChild(el("div",{style:"display:flex;align-items:center;gap:10px;flex-wrap:wrap;"},
          el("button",{class:"btn btn-ghost btn-sm", onclick:openHist}, "Історія подій"+(log.length?" ("+log.length+")":"")),
          el("span",{class:"muted xs"}, cnt ? "Зараз активних проблем: "+cnt : "Зараз проблем немає")));
      }
      if (x.stats){
        const t = x.stats, parts = [];
        if (t.diskPct!=null) parts.push("Диск сервера: "+t.diskPct+"% (вільно "+(t.diskFreeGb||"?")+" ГБ)");
        if (t.audioMb!=null) parts.push("аудіо дзвінків: "+(t.audioMb>=1024 ? (t.audioMb/1024).toFixed(1)+" ГБ" : t.audioMb+" МБ"));
        if (t.memFreeMb!=null) parts.push("вільна пам'ять: "+t.memFreeMb+" МБ");
        if (t.dbPct!=null) parts.push("база Firebase: ≈"+t.dbPct+"% від 1 ГБ (оцінка, ≈"+Math.round(t.dbMb)+" МБ, "+(t.dbCalls||0)+" розмов)");
        if (parts.length) srvInfo.appendChild(el("div",{class:"muted xs",style:"line-height:1.5;"},parts.join(" · ")));
      }
    }
    try {
      const unsub = db.collection("health").doc("server").onSnapshot(sn=>{
        if (!document.body.contains(srvInfo)) { try{unsub();}catch(_){} return; }
        x = sn.exists ? sn.data() : null; loaded = true; paintSrv();
      }, ()=>{});
      const tm = setInterval(()=>{ if (!document.body.contains(srvInfo)){ clearInterval(tm); return; } paintSrv(); }, 60000);
    } catch(_){}
  })();
  (function(){
    let d = null, loaded = false;
    function paint(){
      const beat = d && d.lastBeat && d.lastBeat.toDate ? d.lastBeat.toDate() : null;
      const ageMin = beat ? (Date.now()-beat.getTime())/60000 : null;
      if (beat && ageMin <= 2.5){
        workerChip.className = "chip chip--done"; workerChip.textContent = "Працює";
      } else {
        workerChip.className = "chip chip--error"; workerChip.textContent = beat ? "Не відповідає" : "Не підключений";
      }
      const silent = beat && ageMin > 2.5;
      workerInfo.textContent = beat
        ? "Останній сигнал: " + beat.toLocaleString("uk-UA") + " · у черзі: " + (d.queueLength ?? "—") + (d.lastError ? " · помилка: " + d.lastError : "")
          + (silent ? ". Воркер мовчить " + Math.round(ageMin) + " хв. Можливі причини: сервер вимкнений або без інтернету, воркер зупинився чи завис, база Firebase недоступна. Що робити: RUNBOOK, сценарії 1 і 6 (спершу спробуй systemctl restart aleksa-worker)." : "")
        : (loaded ? "Сигналів від сервера ще не було: воркер ніколи не запускався або не має доступу до бази (RUNBOOK, сценарій 1)." : "");
    }
    try {
      const unsub = db.collection("health").doc("worker").onSnapshot(sn=>{ d = sn.exists ? sn.data() : null; loaded = true; paint(); },
        ex=>{ workerChip.textContent = "Помилка читання"; workerInfo.textContent = String(ex.code||ex.message||ex); });
      const tm = setInterval(()=>{ if (!document.body.contains(workerChip)){ clearInterval(tm); try{unsub();}catch(_){} return; } paint(); }, 15000);
    } catch(ex){ workerChip.textContent = "Помилка читання"; workerInfo.textContent = String(ex.code||ex.message||ex); }
  })();

  let limitUsd = 10;      // місячний ліміт на ШІ в доларах (settings/ai.limitUsd)
  // ---- Витрати ШІ + ліміт ----
  const costNum = el("span",{style:"font-weight:700;font-size:22px;"},"…");
  const costBar = el("span",{style:"width:0%;"});
  const costInfo = el("div",{class:"muted small",style:"margin-top:10px;line-height:1.6;"},"");
  const costWarn = el("div",{style:"margin-top:10px;font-size:13px;line-height:1.5;display:none;border-radius:10px;padding:10px 12px;"},"");
  const limitI = el("input",{type:"number",min:"0.01",step:"any",inputmode:"decimal",class:"input",style:"width:110px;text-align:center;"});
  const limitSave = el("button",{class:"btn btn-primary btn-sm"},"Зберегти ліміт");
  let usageDoc = {};
  function paintCost(){
    const an = Number(usageDoc.analysisCostUsd||0), ch = Number(usageDoc.chatCostUsd||0), spent = Math.max(an+ch, Number(usageDoc.realCostUsd||0));
    const pct = limitUsd>0 ? spent/limitUsd*100 : 0;
    costNum.textContent = "$"+spent.toFixed(2)+" з $"+limitUsd;
    costBar.style.width = Math.min(100,pct)+"%";
    costBar.style.background = pct>=100 ? "var(--danger)" : pct>=90 ? "var(--warn)" : "";
    if (pct>=100){
      costWarn.style.display = ""; costWarn.style.background = "var(--danger-soft)"; costWarn.style.color = "var(--danger)";
      costWarn.textContent = "Ліміт вичерпано — ШІ зупинено: нові аналізи й чат не працюють, розшифровка триває. Збільш ліміт, і ШІ сам продовжить.";
    } else if (pct>=90){
      costWarn.style.display = ""; costWarn.style.background = "var(--warn-soft)"; costWarn.style.color = "var(--warn)";
      costWarn.textContent = "Витрачено понад 90% ліміту. При 100% ШІ автоматично зупиниться.";
    } else costWarn.style.display = "none";
    try { paintForecast(); } catch(_){}
    costInfo.textContent = "Аналізи: $"+an.toFixed(2)+" ("+(usageDoc.analysisRequests||0)+" запитів) · Чат: $"+ch.toFixed(2)+" ("+(usageDoc.chatRequests||0)+" запитів). Цифри оновлюються самі; суму бере сервер із відповідей сервісу ШІ, тому вона збігається з рахунком. Аналіз додається до суми, коли завершується.";
  }
  const costCard = el("div",{class:"card"},
    el("div",{class:"section-title"}, el("span",{},"Витрати ШІ")),
    el("div",{style:"display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;"},
      el("span",{class:"muted small"},"Поточний місяць"), costNum),
    el("div",{class:"bar"}, costBar), costWarn, costInfo,
    el("div",{style:"display:flex;align-items:center;gap:8px;margin-top:14px;flex-wrap:wrap;"},
      el("span",{class:"small"},"Місячний ліміт, $:"), limitI, limitSave),
    el("div",{class:"muted xs",style:"margin-top:8px;line-height:1.5;"},
      "Коли витрати на ШІ за місяць досягають ліміту, ШІ автоматично зупиняється (аналізи й чат); завантаження й розшифровка тривають. При 90% тут з'являється попередження. Якщо збільшити ліміт — ШІ сам продовжує. З початку нового місяця рахунок іде спочатку."));
  limitI.value = limitUsd;
  // живі дані: підписка на витрати поточного місяця й на налаштування
  {
    const d = new Date(); const key = d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    const u1 = db.collection("usage").doc(key).onSnapshot(sn=>{ usageDoc = sn.exists ? sn.data() : {}; if (!document.body.contains(costCard)) return u1(); paintCost(); },
      ex=>{ costNum.textContent="—"; costInfo.textContent="Не вдалося прочитати: "+(ex.code||ex.message||ex); });
    const u2 = db.collection("settings").doc("ai").onSnapshot(sn=>{ if (!document.body.contains(costCard)) return u2(); const c = sn.exists ? sn.data() : {}; if (c.limitUsd){ limitUsd = Number(c.limitUsd); if (document.activeElement!==limitI) limitI.value = limitUsd; } paintCost(); }, ()=>{});
  }
  limitSave.addEventListener("click", async ()=>{
    const v = Number(limitI.value);
    if (!(v>0)){ toast("Введи ліміт більше нуля","err"); return; }
    if (v===limitUsd) return;
    const ok = await confirmModal("Змінити ліміт?", "Ліміт ШІ на місяць: $"+limitUsd+" → $"+v+"."+(v>limitUsd ? " Якщо ШІ був зупинений через ліміт, він продовжить." : ""), "Так, змінити");
    if (!ok) return;
    limitSave.disabled = true;
    try {
      await db.collection("settings").doc("ai").set({ limitUsd:v, limitBy:activeUser.email, limitAt:firebase.firestore.FieldValue.serverTimestamp() }, {merge:true});
      logAction("set_ai_limit", null, "$"+limitUsd+" → $"+v);
      toast("Ліміт збережено","ok");
    } catch(ex){ toast(ex.code||ex.message||String(ex),"err"); }
    limitSave.disabled = false;
  });

  // ---- Прогноз витрат до кінця місяця ----
  const fcMain = el("div",{style:"font-weight:700;font-size:22px;"},"…");
  const fcInfo = el("div",{class:"muted small",style:"margin-top:8px;line-height:1.6;"},"");
  const forecastCard = el("div",{class:"card"},
    el("div",{class:"section-title"}, el("span",{},"Прогноз витрат на ШІ")),
    el("div",{class:"muted small",style:"margin-bottom:6px;"},"Скільки буде витрачено за поточний місяць разом (вже витрачено + очікувані витрати до кінця місяця), якщо темп розмов лишиться таким, як останні 2 тижні. З 1 числа кожного місяця рахунок і прогноз починаються заново."),
    fcMain, fcInfo);
  function paintForecast(){
    const now = new Date();
    const dim = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
    const left = dim - now.getDate();
    const all = callsAll();
    const costs = all.filter(c => c.status==="done" && c.aiUsage && Number(c.aiUsage.costUsd)>0)
      .sort((x,y)=> new Date(y.startedAt)-new Date(x.startedAt)).slice(0,15).map(c=>Number(c.aiUsage.costUsd));
    const avg = costs.length ? costs.reduce((a,b)=>a+b,0)/costs.length : 0;
    const since = new Date(now.getTime()-14*86400000);
    const live = ["done","queued","ended","downloading","transcribing","queued_for_analysis","analyzing","transcribed"];
    const recent = all.filter(c => c.source==="youtube_watcher" && live.includes(c.status) && new Date(c.startedAt)>=since).length;
    const perDay = recent/14;
    const spent = Math.max(Number(usageDoc.analysisCostUsd||0) + Number(usageDoc.chatCostUsd||0), Number(usageDoc.realCostUsd||0));
    const chatShare = (usageDoc.analysisCostUsd>0) ? Math.min(0.5, Number(usageDoc.chatCostUsd||0)/Number(usageDoc.analysisCostUsd)) : 0.1;
    const add = avg*perDay*left*(1+Math.max(0.1,chatShare));
    const total = spent + add;
    fcMain.textContent = costs.length ? "≈ $"+total.toFixed(2) : "мало даних";
    fcMain.style.color = (costs.length && total>limitUsd) ? "var(--danger)" : "";
    fcInfo.textContent = costs.length
      ? "Вже витрачено: $"+spent.toFixed(2)+" · очікується ще ≈ $"+add.toFixed(2)+". Середній аналіз: $"+avg.toFixed(3)+" (за "+costs.length+" останніх) · розмов у день: "+perDay.toFixed(1)+" · залишилось днів: "+left+". Враховано й чат (+"+Math.round(Math.max(0.1,chatShare)*100)+"%). "
        + (total>limitUsd ? "Це більше за ліміт $"+limitUsd+" — ШІ може зупинитись раніше кінця місяця." : "Це в межах ліміту $"+limitUsd+".")
        + (costs.length<5 ? " Даних поки мало — прогноз приблизний." : "")
      : "Ще немає готових аналізів із відомою ціною. Прогноз з'явиться після перших розмов.";
  }
  // ---- Пауза ШІ ----
  const pauseChip = el("span",{class:"chip"},"…");
  const pauseBtn = el("button",{class:"btn btn-primary btn-sm"},"…");
  let paused = false;
  function paintPause(){
    pauseChip.className = "chip "+(paused?"chip--error":"chip--done");
    pauseChip.textContent = paused ? "ШІ на паузі" : "ШІ працює";
    pauseBtn.textContent = paused ? "Увімкнути ШІ" : "Зупинити ШІ";
    pauseBtn.className = "btn btn-sm "+(paused?"btn-primary":"btn-danger-outline");
  }
  db.collection("settings").doc("ai").get().then(sn=>{ paused = !!(sn.exists && sn.data().paused); paintPause(); }).catch(()=>{ pauseChip.textContent="Не прочитано"; });
  pauseBtn.addEventListener("click", async ()=>{
    const want = !paused;

function quoteAtTime(transcript, t){
  if (!transcript || !transcript.length || !t) return null;
  const sec = tcToSec(t);
  // find closest line with t <= sec (last one)
  let best = transcript[0];
  for (const line of transcript){
    if (tcToSec(line.t) <= sec) best = line; else break;
  }
  return best;
}
function postToYT(iframe, func, args){
  try { iframe.contentWindow.postMessage(JSON.stringify({event:"command",func:func,args:args||[]}), "*"); } catch(e){}
}
function tcToSec(t){
  const parts = String(t||"").split(":").map(Number);
  if (parts.length === 3) return (parts[0]||0)*3600 + (parts[1]||0)*60 + (parts[2]||0);
  if (parts.length === 2) return (parts[0]||0)*60 + (parts[1]||0);
  return 0;
}

  function chatNodes(text){

      }
    });
    const last = vis[vis.length-1];
    if (chatWaitTimer){ clearTimeout(chatWaitTimer); chatWaitTimer = null; }
    if (last && last.role==="user"){
      if (isStopped(last.id)){
        chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-stopped"}, el("div",{class:"cv-chat__stopnote"}, "Зупинено")));
      } else {
        let ms = null; try { ms = last.ts && last.ts.toMillis ? last.ts.toMillis() : null; } catch(_){}
        const waited = ms ? Date.now()-ms : 0;
        if (waited > 90000){
          chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-err"}, "Поки що чекаю ключ ШІ. Якщо ключ уже додано, перезапусти сервер."));
        } else {
          chatList.appendChild(el("div",{class:"cv-chat__msg is-ai is-pending"}, "ШІ думає…"));
          chatWaitTimer = setTimeout(paintChat, Math.max(1000, 91000-waited));
        }
      }
    }
    if (chatBtn){
      const st = chatState();
      chatBtn.className = st.busy ? "is-stop" : "";
      chatBtn.textContent = st.busy ? "■" : "→";
      chatBtn.title = st.busy ? "Зупинити відповідь" : "Надіслати";
      chatBtn.type = st.busy ? "button" : "submit";
    }
    requestAnimationFrame(()=>{ chatList.scrollTop = chatList.scrollHeight; });
  }
  async function sendMsg(text){
    if (!text || !text.trim()) return;
    if (!chatMine){ toast("ШІ-чат доступний лише в розмовах, які веде сам менеджер","err"); return; }
    if (!aiAllowed()){ toast(aiDeniedMsg(),"err"); return; }
    const _cur = findCallAny(callId);
    if (!(_cur && (_cur.transcriptReady || _cur.status==="done"))){ toast("Чат доступний після транскрибації розмови","err"); return; }
    if (!(await confirmModal("Точно надіслати питання ШІ?", "«"+(text.trim().length>140 ? text.trim().slice(0,140)+"…" : text.trim())+"»\nОцінка вартості: до ≈ $"+AN_EST_CHAT.toFixed(2)+" за питання (ШІ читає всю розшифровку розмови). Це платний запит.", "Так, надіслати"))) return false;
    const msg = {
      role: "user",
      text: text.trim(),
      uid: (activeUser && activeUser.uid) || null,
      authorEmail: (activeUser && activeUser.email) || null,
      ts: firebase.firestore.FieldValue.serverTimestamp(),
      status: "done",
    };
    try {
      await chatRef.add(msg);
      logAction("chat_question", _cur, text.trim().slice(0,80));
    } catch (ex) {
      console.error("chat write:", ex);
      alert("Не вдалося зберегти повідомлення: " + (ex.code||ex.message));
      return;
    }
  }
  const chatInput = el("textarea",{rows:"1",placeholder:!chatMine ? "ШІ-чат доступний лише власнику розмови" : (aiAllowed() ? "Запитай ШІ про цю розмову…" : "Доступ до ШІ-чату закрито адміністратором"),maxlength:"2000"});
  if (!aiAllowed() || !chatMine) chatInput.disabled = true;
  // поле росте вгору разом з текстом (до ~6 рядків), далі прокрутка; Enter — надіслати, Shift+Enter — новий рядок
  const CHAT_MAX = 98;   // ≈ 4 рядки; більше — з'являється прокрутка
  const chatFit = ()=>{
    chatInput.style.height = "auto";
    const border = chatInput.offsetHeight - chatInput.clientHeight;       // рамка, яку scrollHeight не враховує
    const h = chatInput.scrollHeight + border;
    chatInput.style.height = Math.min(h, CHAT_MAX) + "px";
    chatInput.style.overflowY = h > CHAT_MAX ? "auto" : "hidden";             // повзунок лише коли тексту справді більше 6 рядків
  };
  chatInput.addEventListener("input", chatFit);
  chatInput.addEventListener("keydown", (e)=>{
    if (e.key==="Enter" && !e.shiftKey && !e.isComposing && !(window.matchMedia && matchMedia("(pointer:coarse)").matches)){
      e.preventDefault(); if (chatInput.form && chatInput.form.requestSubmit) chatInput.form.requestSubmit();
    }
  });
  const chatForm = el("form",{class:"cv-chat__form", onsubmit:(e)=>{ e.preventDefault(); const v = chatInput.value; if (!v.trim()) return; chatInput.value=""; chatFit(); sendMsg(v).then(ok=>{ if (ok===false && !chatInput.value){ chatInput.value = v; chatFit(); } }); }},
    chatInput, (chatBtn = el("button",{type:"submit", title:"Надіслати",
      onclick:(e)=>{ const st = chatState(); if (st.busy){ e.preventDefault(); stopChat(st.targetId); } }},"→")));
  const chatQuick = el("div",{class:"cv-chat__quick"},
    MOCK_CHAT_SUGGESTIONS.map(q => el("button",{type:"button", onclick:()=>sendMsg(q)}, q)));
  const chat = el("div",{class:"cv-chat"},
    el("div",{class:"cv-chat__head"}, "ШІ-чат"),
    chatList, chatForm);
  paintChat();

  // Splitter — resize player vs chat; persisted per user
  const prefKey = "alexa_cv_player_h_" + ((activeUser && activeUser.email) || "anon");
  const savedH = parseInt(localStorage.getItem(prefKey) || "0", 10);
  function applyPlayerHeight(h){
    if (!h || h < 120) return;
    playerNode.classList.add("is-fixed");
    playerNode.style.height = h + "px";
  }
  if (savedH > 120) applyPlayerHeight(savedH);
  const splitter = el("div",{class:"cv-splitter", title:"Перетягни щоб змінити розмір"});
  splitter.addEventListener("mousedown",(e)=>{
    e.preventDefault();
    document.body.classList.add("is-row-resizing");
    splitter.classList.add("is-drag");
    const shield = el("div",{class:"drag-shield"});
    document.body.appendChild(shield);
    const rect = playerNode.getBoundingClientRect();
    const startY = e.clientY, startH = rect.height;
    const paneRight = splitter.parentElement;
    const paneRect = paneRight.getBoundingClientRect();
    const minPlayer = 120;
    const minChat   = 120;
    const onMove = (ev)=>{
      const dy = ev.clientY - startY;
      const maxH = paneRect.height - minChat - 40;
      const h = Math.max(minPlayer, Math.min(maxH, startH + dy));
      applyPlayerHeight(h);
    };
    const onUp = ()=>{
      shield.removeEventListener("mousemove", onMove);
      shield.removeEventListener("mouseup", onUp);
      document.removeEventListener("mouseup", onUp);
      shield.remove();
      document.body.classList.remove("is-row-resizing");
      splitter.classList.remove("is-drag");
      try { localStorage.setItem(prefKey, String(Math.round(playerNode.getBoundingClientRect().height))); } catch(_){}
    };
    shield.addEventListener("mousemove", onMove);
    shield.addEventListener("mouseup", onUp);
    document.addEventListener("mouseup", onUp); // safety if cursor leaves window
  });

  const pKind = (playerNode.className.includes("cv-player__video") ? "iframe" : "ph") + ":" + (d.youtubeId||"");
  const existingGrid = root.querySelector(".cv-grid");
  if (existingGrid && root.dataset.callId===callId && root.dataset.playerKind===pKind){
    // той самий відео-стан: оновлюємо лише ліву колонку, плеєр і чат не перемальовуємо
    const left = existingGrid.querySelector(".cv-pane-left"), top = left.scrollTop;
    left.replaceChildren(tabsBar, content);
    left.scrollTop = top;
    try { paintWave(); } catch(_){}
    return;
  }
  root.dataset.callId = callId; root.dataset.playerKind = pKind;
  root.replaceChildren(
    el("div",{class:"cv-grid"},
      el("div",{class:"cv-pane-left"}, tabsBar, content),
      el("div",{class:"cv-pane-right"},
        el("div",{class:"cv-player",style:"flex-shrink:0;"}, playerNode),
        splitter,
        chat)
    )
  );
  // reset scroll of left pane after render
  const paneL = root.querySelector(".cv-pane-left");
  if (paneL) paneL.scrollTop = 0;
}

        videoId: videoId,

        createdBy: actor.uid,
        createdByEmail: actor.email,
        source: "manual",
        ...(isAdminTarget(mgr) ? { kind: "admin_meeting" } : {}),
        status: "queued",
        stage: "waiting_worker",
        durationSec: 0,
        score: null,
        summaryShort: "",
        audioReady: false,

      toast("Додано. Якщо сервер вимкнений — задача чекатиме, поки він запрацює", "ok");

      el("h2",{class:"cv-modal__title"},"Додати розмову"),
      el("div",{class:"cv-modal__sub"},"Запис буде поставлений у чергу. Сервер підхопить і обробить автоматично.")),
    el("button",{class:"cv-modal__close", title:"Закрити", onclick:()=>{ location.hash = "#/calls"; }}, ICONS.x())
  );
  modal.appendChild(header);

      el("button",{class:"btn btn-ghost", onclick:()=>{ location.hash = "#/calls"; }},"Скасувати"),

  body.appendChild(inner);

  ov.appendChild(modal);

  if (!window.__cvEsc){
    window.__cvEsc = (e)=>{ if (e.key==="Escape" && document.getElementById("cv-overlay")) location.hash = "#/calls"; };
    document.addEventListener("keydown", window.__cvEsc);
  }
}

  if (!window.__cvEsc){
    window.__cvEsc = (e)=>{ if (e.key==="Escape" && document.getElementById("cv-overlay")) location.hash = "#/calls"; };
    document.addEventListener("keydown", window.__cvEsc);
  }
  try { renderCallDetail(body, callId); }
  catch(e){ console.error(e); body.replaceChildren(el("div",{class:"card"},"Помилка: "+(e.message||e))); }
}
/* ========================================================
 *  Shell + router
 * ======================================================== */
let activeUser = null;
const ROUTES = {
  "#/overview": renderOverview,
  "#/calls":    renderCalls,
  "#/progress": renderProgress,
  "#/scripts":  renderScripts,
  "#/users":    renderUsers,
  "#/settings": renderSettings,
};
function parseHash(){
  const h = (location.hash||"#/overview").replace(/^#\//, "");
  const parts = h.split("/");
  return { route: parts[0] || "overview", arg: parts[1] || null };
}
function activeKey(){ return parseHash().route; }
function ensureRoot(){
  let r=document.getElementById("app");
  if (!r){ r=document.createElement("div"); r.id="app"; document.body.appendChild(r); }
  return r;
}
function render(){
  try { window.__lastListSig = parseHash().route+"|"+callsSig(); } catch(_){ window.__lastListSig = null; }
  if (!activeUser){ closeFullscreen(); renderLogin(ensureRoot()); return; }
  if (activeUser.status==="disabled"){
    document.querySelectorAll("nav.navbar").forEach(n=>n.remove());
    ensureRoot().replaceChildren(el("div",{class:"login-wrap"},
      el("div",{class:"card login-card",style:"text-align:center;"},
        el("h2",{style:"margin:0 0 10px;color:var(--danger);"},"Доступ вимкнено"),
        el("div",{style:"color:var(--text-muted);margin-bottom:16px;"},"Твій акаунт вимкнений адміністратором."),
        el("button",{class:"btn btn-ghost",onclick:()=>auth.signOut()},"Вийти"))));
    return;
  }
  const { route, arg } = parseHash();
  // Fullscreen branch: do NOT build navbar/shell
  if (route==="calls" && arg){
    const allowed0 = new Set(MENU_BY_ROLE[activeUser.role]||[]);
    if (allowed0.has("calls")){
      if (arg==="new"){ openAddCallFullscreen(); return; }
      openCallFullscreen(arg); return;
    }
  }
  // Normal: ensure overlay is closed, build navbar/shell
  closeFullscreen();
  document.querySelectorAll("nav.navbar").forEach(n=>n.remove());
  document.body.prepend(navbar(activeUser, route));
  let shell=document.getElementById("app");
  if (!shell || !shell.classList.contains("app-shell")){
    if (shell) shell.remove();
    shell=document.createElement("div"); shell.id="app"; shell.className="app-shell";
    document.body.appendChild(shell);
  }
  // Deep-link: #/calls/<id> → fullscreen overlay (before touching shell)
  if (route==="calls" && arg){
    const allowedD = new Set(MENU_BY_ROLE[activeUser.role]||[]);
    if (allowedD.has("calls")){ openCallFullscreen(arg); return; }
  }
  // We're on a normal route — tear down any overlay
  closeFullscreen();
  const allowed = new Set(MENU_BY_ROLE[activeUser.role]||[]);
  if (!allowed.has(route)){
    shell.replaceChildren(el("h1",{class:"page-title"},"Немає доступу"),
      el("div",{class:"card"},"Для твоєї ролі цей розділ недоступний."));
    return;
  }
  const fn = ROUTES["#/"+route] || renderOverview;
  // кожен розділ малюється у власний контейнер: повільний (async) розділ, від якого вже пішли, не перезапише поточний
  const view = document.createElement("div");
  shell.replaceChildren(view);
  Promise.resolve(fn(view)).catch(err=>{
    console.error(err);
    view.replaceChildren(el("div",{class:"card"},"Помилка: "+(err.message||err)));
  });
}
window.addEventListener("hashchange", render);
window.addEventListener(CALLS_CHANGED_EVT, ()=>{
  try { listProgressUpdate(); } catch(_){}
  if (!activeUser) return;
  const { route, arg } = parseHash();
  // Re-render just the content area for live updates without re-mounting navbar/overlay
  if (route==="calls" && arg){
    const ov = document.getElementById("cv-overlay");
    if (ov){
      // re-render only the detail body (keep modal shell)
      const body = ov.querySelector(".cv-modal__body");
      // перемальовувати лише якщо змінились суттєві поля цієї розмови (інакше відео в плеєрі перезавантажується
      // від кожного оновлення прогресу / інших розмов)
      const cur = findCallAny(arg);
      const sig = cur ? JSON.stringify([cur.status, cur.embeddable, cur.title, cur.client, cur.audioReady, cur.transcriptReady, cur.score, cur.summaryShort, cur.error, cur.videoId, cur.durationSec]) : "";
      if (body && body.dataset.sig === undefined){ body.dataset.sig = sig; }
      else if (body && body.dataset.sig !== sig){
        body.dataset.sig = sig;
        try { renderCallDetail(body, arg); } catch(e){ console.warn(e); }
      }
    }
    return;
  }
  if (["overview","calls","progress"].includes(route)){
    const sg = callsSig(); const key = route+"|"+sg;
    if (window.__lastListSig === key) return;   // нічого видимого не змінилось — не перемальовуємо
    window.__lastListSig = key;
    const shell = document.getElementById("app");
    if (!shell) return;
    const fn = ROUTES["#/"+route];
    if (fn) { try { fn(shell); } catch(e){ console.warn(e); } }
  }
});
window.__refreshAfterProfile = async () => {
  try { activeUser = await getCurrentUser(); await refreshUserCache(true); render(); } catch(ex){ console.error(ex); }
};
auth.onAuthStateChanged(async (u)=>{
  document.querySelectorAll("nav.navbar").forEach(n=>n.remove());
  const fresh=document.createElement("div"); fresh.id="app";
  const old=document.getElementById("app"); if (old) old.replaceWith(fresh); else document.body.appendChild(fresh);
  if (!u){ activeUser=null; stopCallsSubscription(); stopScriptsSubscription(); stopUsersWatch(); renderLogin(fresh); return; }
  try { activeUser = await getCurrentUser(); if (activeUser){ startUsersWatch(activeUser.role===ROLES.ADMIN||activeUser.role===ROLES.MAIN_ADMIN||activeUser.role===ROLES.DEVELOPER); } await refreshUserCache(); startCallsSubscription(activeUser);
    // «Зайшов» пишемо лише коли людина справді ввела пароль на формі входу (а не при кожному відкритті сайту з уже збереженим входом)
    if (activeUser){ try { if (sessionStorage.getItem("alexa_real_login")==="1"){ sessionStorage.removeItem("alexa_real_login"); logAction("login"); } } catch(_){} } }
  catch(ex){
    fresh.replaceChildren(el("div",{class:"card login-card",style:"margin:40px auto;background:var(--danger-soft);border-color:var(--danger);"},
      el("div",{style:"font-weight:600;color:var(--danger);"},"Не вдалося прочитати users/{email}"),
      el("div",{style:"margin-top:6px;color:var(--text-muted);font-size:13px;"}, String(ex.code||ex.message||ex)),
      el("div",{style:"margin-top:10px;"}, el("button",{class:"btn btn-ghost",onclick:()=>auth.signOut()},"Вийти"))));
    return;
  }
  render();
});
</script>
